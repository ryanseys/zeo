[package]
name = "zeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An ahead-of-time Ruby compiler: compiles Ruby programs to self-contained native binaries by emitting Rust"
readme = "../../README.md"
default-run = "zeo"

[dependencies]
zeo-abi.workspace = true
ruby-prism.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
prettyplease.workspace = true
miette.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `flock(2)` for the cross-process runtime-build lock in `backend`.
libc.workspace = true
# Fast non-DoS-resistant hashing for compiler-internal name sets (same
# policy zeo-rt already uses for its internal maps).
foldhash.workspace = true

[build-dependencies]
# The build.rs projects the compiler's `CLASS_SURFACE` by re-parsing the
# runtime's ruby_class!/ruby_module! headers with the SAME grammar the macro
# uses -- so the compiler's folding view can't drift from what the runtime
# registers. See build.rs.
zeo-dsl.workspace = true
syn.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
insta.workspace = true
datatest-stable.workspace = true
# The arity drift test re-parses the runtime's DSL declarations with the same
# grammar the macro expands, so what it checks is what the runtime registers.
zeo-dsl = { workspace = true, features = ["spans"] }

[lib]
name = "zeo"
path = "src/lib.rs"

[[bin]]
name = "zeo"
path = "src/main.rs"

# Golden-file suites: one nextest case per `.rb`, comparing zeo's output to the
# committed ruby-oracle `.expected` (see tests/support/golden.rs). `harness =
# false` hands the target to datatest-stable. `ZEO_BLESS=1` rewrites goldens.
[[test]]
name = "gaps"
path = "tests/gaps.rs"
harness = false

[[test]]
name = "examples"
path = "tests/examples.rs"
harness = false

[[test]]
name = "spinel"
path = "tests/spinel.rs"
harness = false

[lints]
workspace = true
