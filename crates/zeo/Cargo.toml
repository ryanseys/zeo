[package]
name = "zeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An ahead-of-time Ruby compiler: compiles Ruby programs to self-contained native binaries through Cranelift"
documentation = "https://docs.rs/zeo"
readme = "README.md"
# Packaging whitelist: the .crate ships the compiler, the mkmf shim that
# `include_str!`s from /tools-lib, and the two publish-time artifacts
# `cargo xtask stage-crate` stages (the pregen class surface rides inside
# /src). /tests -- the golden and e2e suites, rooted at the repo corpus --
# is deliberately outside it.
include = [
    "/src",
    "/build.rs",
    "/tools-lib",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/gems.pregen.tar.gz",
]

# docs.rs must not build the vendored-C heavyweights (OpenSSL, libffi) or
# the C API. The feature list mirrors zeo-rt's docs.rs set.
[package.metadata.docs.rs]
no-default-features = true
features = [
    "ext-base64",
    "ext-monitor",
    "ext-stringio",
    "ext-strscan",
    "ext-cgi",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-etc",
    "ext-fcntl",
    "ext-io-console",
    "ext-pty",
    "ext-syslog",
    "ext-nkf",
    "ext-bigdecimal",
    "ext-coverage",
    "ext-tracepoint",
    "ext-prism",
]

[dependencies]
# RubyGems formats: `Gemfile.lock`, gemspecs, platforms, versions.
zeo-gem.workspace = true
# The package row manifest (`package.rs`): a separately compiled gem's
# registration rows as data.
serde.workspace = true
serde_json.workspace = true
zeo-abi.workspace = true
# The runtime, linked INTO the compiler: the `zeo` binary hosts the
# Cranelift JIT run path, and the staticlib output below is `libzeo.a` --
# the one archive AOT programs link.
zeo-rt.workspace = true
# The C extension API, behind `capi`: the crate is linked (and so exported
# from `libzeo.a`) only when the feature is on.
zeo-capi = { workspace = true, optional = true }
# The C API headers' archive is verified against the pin before it is unpacked
# (`cext::headers`).
sha2.workspace = true
# The Cranelift backend: HIR -> CLIF -> object files (see `clif/`), linked
# against `libzeo.a` by `backend/link.rs`.
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-module.workspace = true
cranelift-object.workspace = true
gimli.workspace = true
object.workspace = true
cranelift-native.workspace = true
cranelift-jit.workspace = true
# `zeo backend`: CLIF text a front end other than this crate's wrote.
cranelift-reader.workspace = true
target-lexicon.workspace = true
ruby-prism.workspace = true
# Unicode XID tables: a Ruby name is far wider than any target identifier
# (`@height´` is a legal ivar), so `names::transliterate` needs the real
# classification to build a symbol fragment.
unicode-ident.workspace = true
miette.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `memguard`'s RSS and physical-memory reads, and the libc type widths
# `lower::ffi` folds into an emitted program's FFI struct layouts.
libc.workspace = true
# Fast non-DoS-resistant hashing for compiler-internal name sets (same
# policy zeo-rt already uses for its internal maps).
foldhash.workspace = true
# The global allocator: the front end is allocation-heavy (arena nodes,
# interner strings, token streams), and mimalloc reliably beats system
# malloc on that shape. Declared in lib.rs -- `libzeo.a` must carry the
# ONE allocator every AOT program runs on, so the library owns it and the
# binary and the test harnesses inherit it.
mimalloc.workspace = true
# The registry install tier (`cargo install zeo`): tar+flate2 unpack the
# embedded gems archive into the payload (`home::stage_embedded_gems`).
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
# CLIF snapshot pinning (`tests/suite/checks/clif.rs`) and the diagnostic
# renderings (`tests/suite/checks/diagnostics.rs`).
insta.workspace = true
zeo-abi.workspace = true
datatest-stable.workspace = true
# The derived manifest gems_vendored.rs reads.
serde_json.workspace = true
# The bench journal's per-row staleness key (benches/programs.rs).
sha2.workspace = true
# diagnostics.rs renders compile errors the way the CLI does.
miette.workspace = true
# The runtime performance bank (benches/programs.rs).
criterion.workspace = true

# One nextest case per `.rb` under `test/` per leg, held to the answer
# recorded under its `__END__` (tests/corpus/). `harness = false` hands the
# target to datatest-stable, whose case names are `<fn>::<path>`, so one
# binary carries every suite and every leg and a `test(core::)` filter still
# names exactly one. `tests/suite/` carries both `checks/` and `api/`.
# Two test binaries, and the split is forced: `corpus` replaces libtest with
# datatest-stable (`harness = false`), so nothing with an ordinary `#[test]`
# can live in it. Everything else is one binary, because a test target costs
# a full link of the compiler.
[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
harness = false

[[test]]
name = "suite"
path = "tests/suite/main.rs"

# The runtime performance bank: every `bench/bm_*.rb` compiled with the
# release `zeo` and timed end-to-end, under criterion (saved baselines,
# `critcmp` comparisons). `harness = false` hands main() to criterion.
[[bench]]
name = "programs"
path = "benches/programs.rs"
harness = false

[features]
# The stock build carries every runtime extension and the C-extension
# surface. The default is the
# EXPLICIT per-ext list, never a forward to zeo-rt's umbrella: the compiler's
# own `cfg!(feature = "ext-*")` is what `lower::features::build_carries_ext`
# reads, so a runtime feature the compiler cannot see would make it lie.
# `--no-default-features --features <every ext but one>` builds a zeo whose
# loader serves that gem's `pure/` Ruby tree (or answers LoadError) instead
# of the absent Rust half -- the dual-build switch. `pure-stdlib` is the
# named subtraction set for the pure-Ruby lane gems.
default = [
    "capi",
    "ext-base64",
    "ext-monitor",
    "ext-stringio",
    "ext-strscan",
    "ext-cgi",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-openssl",
    "ext-ffi",
    "ext-etc",
    "ext-fcntl",
    "ext-io-console",
    "ext-pty",
    "ext-syslog",
    "ext-nkf",
    "ext-bigdecimal",
    "ext-coverage",
    "ext-tracepoint",
    "ext-prism",
]
capi = ["dep:zeo-capi"]
ext-base64 = ["zeo-rt/ext-base64"]
ext-monitor = ["zeo-rt/ext-monitor"]
ext-stringio = ["zeo-rt/ext-stringio"]
ext-strscan = ["zeo-rt/ext-strscan"]
ext-cgi = ["zeo-rt/ext-cgi"]
ext-digest = ["zeo-rt/ext-digest"]
ext-json = ["zeo-rt/ext-json"]
ext-date = ["zeo-rt/ext-date"]
ext-zlib = ["zeo-rt/ext-zlib"]
ext-psych = ["zeo-rt/ext-psych"]
ext-socket = ["zeo-rt/ext-socket"]
ext-openssl = ["zeo-rt/ext-openssl"]
ext-ffi = ["zeo-rt/ext-ffi"]
ext-etc = ["zeo-rt/ext-etc"]
ext-fcntl = ["zeo-rt/ext-fcntl"]
ext-io-console = ["zeo-rt/ext-io-console"]
ext-pty = ["zeo-rt/ext-pty"]
ext-syslog = ["zeo-rt/ext-syslog"]
ext-nkf = ["zeo-rt/ext-nkf"]
ext-bigdecimal = ["zeo-rt/ext-bigdecimal"]
ext-coverage = ["zeo-rt/ext-coverage"]
ext-tracepoint = ["zeo-rt/ext-tracepoint"]
ext-prism = ["zeo-rt/ext-prism"]
# Everything except the pure-Ruby lane gems' Rust (base64, strscan,
# stringio, cgi) and the C-extension surface -- readline is GONE entirely:
# the official pure readline gem rides the lock over reline. Usable per gem as
# its `pure/` tree lands; a require of a lane gem with no tree yet answers
# LoadError, which is ruby-without-the-ext's answer too.
pure-stdlib = [
    "ext-monitor",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-openssl",
    "ext-ffi",
    "ext-etc",
    "ext-fcntl",
    "ext-io-console",
    "ext-pty",
    "ext-syslog",
    "ext-nkf",
    "ext-bigdecimal",
    "ext-coverage",
    "ext-tracepoint",
    "ext-prism",
]

# What a zeo-built program starts with, before its own first line. Each one
# is the DEFAULT of the matching `--enable=`/`--disable=` dial in
# `src/cli/features.rs`, so a build decides what its binaries carry and a
# command line still overrides it either way.
#
# All three are off in the stock build, for one reason: an ambient
# `require "rubygems"` compiles 241 files into every program, whether that
# program names `Gem` or not. `--enable=gems` asks for it today, and the
# default flips once those files are compiled once instead of per program.
ambient-gems = []
ambient-did-you-mean = []
ambient-error-highlight = []

[build-dependencies]
# The build.rs projects the compiler's `CLASS_SURFACE` by re-parsing the
# runtime's ruby_class!/ruby_module! headers with the SAME grammar the macro
# uses -- so the compiler's folding view can't drift from what the runtime
# registers. See build.rs.
zeo-dsl.workspace = true
syn.workspace = true
proc-macro2.workspace = true

[lib]
name = "zeo"
path = "src/lib.rs"
# One rustc invocation, two outputs: the rlib the `zeo` binary (and the
# test harnesses) link, and `libzeo.a` -- runtime + compiler + deps + std
# + the allocator -- which `zeo -o` links into AOT programs (the compiler
# half dead-strips out of eval-free binaries). See `backend/link.rs`.
crate-type = ["rlib", "staticlib"]

# `src/main.rs` calls `zeo::cli::main()` and holds no tests of its own -- the
# api suite drives the same verbs in process. Without this, cargo links a
# whole second copy of the compiler as a unit-test binary for it.
[[bin]]
name = "zeo"
path = "src/main.rs"
test = false

[lints]
workspace = true
