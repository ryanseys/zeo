[package]
name = "zeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An ahead-of-time Ruby compiler: compiles Ruby programs to self-contained native binaries by emitting Rust"
readme = "../../README.md"
default-run = "zeo"
# Packaging whitelist: the integration/golden suites live in `zeo-tests`
# (repo-rooted, unpublishable); the .crate ships only the compiler itself
# plus the two publish-time artifacts `cargo xtask stage-publish` stages
# (the pregen class surface rides inside /src).
include = ["/src", "/build.rs", "/README.md", "/gems.pregen.tar.gz"]

[dependencies]
zeo-abi.workspace = true
# The runtime, linked INTO the compiler (plan decision 9, reversed
# 2026-08-18): the `zeo` binary hosts the Cranelift JIT run path, and the
# staticlib output below is `libzeo.a` -- the one archive AOT programs
# link. `eval-vm` on because the shipped runtime is the single
# always-eval-capable variant (the Lean/Eval split dies at M0.5).
zeo-rt = { workspace = true, features = ["eval-vm"] }
# The Cranelift backend: HIR -> CLIF -> object files (see `clif/`), linked
# against `libzeo.a` by `backend/link.rs`.
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-module.workspace = true
cranelift-object.workspace = true
gimli.workspace = true
object.workspace = true
cranelift-native.workspace = true
cranelift-jit.workspace = true
target-lexicon.workspace = true
ruby-prism.workspace = true
proc-macro2.workspace = true
unicode-ident.workspace = true
quote.workspace = true
syn.workspace = true
prettyplease.workspace = true
miette.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `flock(2)` for the cross-process runtime-build lock in `backend`.
libc.workspace = true
# Fast non-DoS-resistant hashing for compiler-internal name sets (same
# policy zeo-rt already uses for its internal maps).
foldhash.workspace = true
# The global allocator: the front end is allocation-heavy (arena nodes,
# interner strings, token streams), and mimalloc reliably beats system
# malloc on that shape. Declared in lib.rs -- `libzeo.a` must carry the
# ONE allocator every AOT program runs on, so the library owns it and the
# binary and the test harnesses inherit it.
mimalloc.workspace = true
# The registry install tier (`cargo install zeo`): tar+flate2 unpack the
# embedded gems archive; serde_json reads cargo's --message-format=json
# stream to locate the crates.io-built zeo-rt rlib.
tar.workspace = true
flate2.workspace = true
serde_json.workspace = true

[dev-dependencies]
# CLIF snapshot pinning (`tests/clif.rs`).
insta.workspace = true

[build-dependencies]
# The build.rs projects the compiler's `CLASS_SURFACE` by re-parsing the
# runtime's ruby_class!/ruby_module! headers with the SAME grammar the macro
# uses -- so the compiler's folding view can't drift from what the runtime
# registers. See build.rs.
zeo-dsl.workspace = true
syn.workspace = true
proc-macro2.workspace = true

[lib]
name = "zeo"
path = "src/lib.rs"
# One rustc invocation, two outputs: the rlib the `zeo` binary (and the
# test harnesses) link, and `libzeo.a` -- runtime + compiler + deps + std
# + the allocator -- which `zeo -o` links into AOT programs (the compiler
# half dead-strips out of eval-free binaries). See `backend/link.rs`.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "zeo"
path = "src/main.rs"

[lints]
workspace = true
