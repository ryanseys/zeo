[package]
name = "zeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "An ahead-of-time Ruby compiler: compiles Ruby programs to self-contained native binaries through Cranelift"
readme = "../../README.md"
default-run = "zeo"
# Packaging whitelist: the .crate ships only the compiler itself plus the
# two publish-time artifacts `tools/zeo-dev stage-publish` stages (the
# pregen class surface rides inside /src). /tests -- the golden and e2e
# suites, rooted at the repo corpus -- is deliberately outside it.
include = ["/src", "/build.rs", "/README.md", "/gems.pregen.tar.gz"]

[dependencies]
zeo-abi.workspace = true
# The runtime, linked INTO the compiler (plan decision 9, reversed
# 2026-08-18): the `zeo` binary hosts the Cranelift JIT run path, and the
# staticlib output below is `libzeo.a` -- the one archive AOT programs
# link.
zeo-rt.workspace = true
# The Cranelift backend: HIR -> CLIF -> object files (see `clif/`), linked
# against `libzeo.a` by `backend/link.rs`.
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-module.workspace = true
cranelift-object.workspace = true
gimli.workspace = true
object.workspace = true
cranelift-native.workspace = true
cranelift-jit.workspace = true
target-lexicon.workspace = true
ruby-prism.workspace = true
# Unicode XID tables: a Ruby name is far wider than any target identifier
# (`@height´` is a legal ivar), so `names::transliterate` needs the real
# classification to build a symbol fragment.
unicode-ident.workspace = true
miette.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `memguard`'s RSS and physical-memory reads, and the libc type widths
# `lower::ffi` folds into an emitted program's FFI struct layouts.
libc.workspace = true
# Fast non-DoS-resistant hashing for compiler-internal name sets (same
# policy zeo-rt already uses for its internal maps).
foldhash.workspace = true
# The global allocator: the front end is allocation-heavy (arena nodes,
# interner strings, token streams), and mimalloc reliably beats system
# malloc on that shape. Declared in lib.rs -- `libzeo.a` must carry the
# ONE allocator every AOT program runs on, so the library owns it and the
# binary and the test harnesses inherit it.
mimalloc.workspace = true
# The registry install tier (`cargo install zeo`): tar+flate2 unpack the
# embedded gems archive into the payload (`home::stage_embedded_gems`).
tar.workspace = true
flate2.workspace = true

[dev-dependencies]
# CLIF snapshot pinning (`tests/clif.rs`) and the diagnostic renderings
# (`tests/repo_checks/diagnostics.rs`).
insta.workspace = true
# The golden + e2e harness library. The suites live HERE, in the package
# that owns the `zeo` binary and the `libzeo.a` staticlib, so cargo itself
# rebuilds both before any suite runs -- the staleness canary the harness
# once carried is cargo's own dependency edge now. The dev-dep cycle
# (zeo-tests depends on zeo) is the standard, cargo-sanctioned shape and is
# stripped from the published .crate.
zeo-tests.workspace = true
zeo-abi.workspace = true
datatest-stable.workspace = true
# The derived manifest gems_vendored.rs reads.
serde_json.workspace = true
# diagnostics.rs renders compile errors the way the CLI does.
miette.workspace = true
# The runtime performance bank (benches/programs.rs). Lean build: no
# plotters/HTML -- saved baselines + `critcmp` are the comparison story.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Golden-file suites: one nextest case per `.rb`, comparing zeo's output to
# the committed ruby-oracle `.expected` (see zeo-tests/src/golden.rs).
# `harness = false` hands the target to datatest-stable.
# `tools/zeo-dev bless <filter>` rewrites goldens.
[[test]]
name = "gaps"
path = "tests/gaps.rs"
harness = false

[[test]]
name = "examples"
path = "tests/examples.rs"
harness = false

[[test]]
name = "gemtests"
path = "tests/gemtests.rs"
harness = false

# The umbrella entry points, one named case each -- see tests/milestones.rs.
# Opted out of the default nextest profile with the other whole-graph suites.
[[test]]
name = "milestones"
path = "tests/milestones.rs"
harness = false

[[test]]
name = "spinel"
path = "tests/spinel.rs"
harness = false

# The insta PILOT (overhaul decision 2): ~10 goldens duplicated under
# tests/insta-pilot/ with co-located .snap storage, for the format
# comparison. Disposable: deleting it is `rm -r tests/insta-pilot` plus
# this block.
[[test]]
name = "insta_pilot"
path = "tests/insta_pilot.rs"
harness = false

# The runtime performance bank: every `bench/bm_*.rb` compiled with the
# release `zeo` and timed end-to-end, under criterion (saved baselines,
# `critcmp` comparisons). `harness = false` hands main() to criterion.
[[bench]]
name = "programs"
path = "benches/programs.rs"
harness = false

[build-dependencies]
# The build.rs projects the compiler's `CLASS_SURFACE` by re-parsing the
# runtime's ruby_class!/ruby_module! headers with the SAME grammar the macro
# uses -- so the compiler's folding view can't drift from what the runtime
# registers. See build.rs.
zeo-dsl.workspace = true
syn.workspace = true
proc-macro2.workspace = true

[lib]
name = "zeo"
path = "src/lib.rs"
# One rustc invocation, two outputs: the rlib the `zeo` binary (and the
# test harnesses) link, and `libzeo.a` -- runtime + compiler + deps + std
# + the allocator -- which `zeo -o` links into AOT programs (the compiler
# half dead-strips out of eval-free binaries). See `backend/link.rs`.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "zeo"
path = "src/main.rs"

[lints]
workspace = true
