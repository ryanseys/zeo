[package]
name = "zeo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zeo-abi.workspace = true
zeo-hir.workspace = true
ruby-prism.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
prettyplease.workspace = true
miette.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
datatest-stable.workspace = true

[lib]
name = "zeo"
path = "src/lib.rs"

[[bin]]
name = "zeo"
path = "src/main.rs"

# Golden-file suites: one nextest case per `.rb`, comparing zeo's output to the
# committed ruby-oracle `.expected` (see tests/support/golden.rs). `harness =
# false` hands the target to datatest-stable. `ZEO_BLESS=1` rewrites goldens.
[[test]]
name = "gaps"
path = "tests/gaps.rs"
harness = false

[[test]]
name = "examples"
path = "tests/examples.rs"
harness = false

[[test]]
name = "corpus"
path = "tests/corpus.rs"
harness = false

[lints]
workspace = true
