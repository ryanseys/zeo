[package]
name = "spinel-rt"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# `dylib` alongside the default `rlib` so generated programs can link the
# runtime dynamically (`-C prefer-dynamic`) instead of each statically slurping
# a 31MB rlib. The `rlib` stays because the workspace's own crates link it
# normally.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
spinel-abi = { path = "../spinel-abi" }
# Runtime string `eval` (#97 stage 2): the SAME parser the compiler uses,
# linked into the runtime behind the `eval-vm` feature so a program that never
# evals a dynamic string carries none of it. The interpreter (`eval_vm.rs`)
# walks prism's `Node` tree directly against the existing dispatch/runtime
# primitives -- no shared HIR crate, no compile-time-resolved assumptions to
# undo.
ruby-prism = { version = "1.9.0", optional = true }
parking_lot = "0.12"
indexmap = "2"
regex = "1"
# Backtracking regex engine for the constructs the linear-time `regex` crate
# structurally can't do -- in-pattern backreferences and look-around. Selected
# per-pattern (a pre-scan) so the common case keeps `regex`'s fast path.
fancy-regex = "0.14"
spinel-fiber = { path = "../spinel-fiber" }
may = "0.3"
# Ident concatenation in `builtin_methods!` so each method table also emits a
# companion `<lookup>_names()` slice (the reflection surface for
# `instance_methods`/`methods`), keeping the names derived from the same rows.
paste = "1"
# The numeric tower (Phase 17.1): arbitrary-precision Integer. num-bigint
# over malachite (LGPL) / ibig (unmaintained); pure Rust, MIT/Apache, and
# BigInt's bitwise ops already implement Ruby's infinite-two's-complement
# semantics. num-integer supplies floored div/mod + gcd/lcm; num-traits the
# to_i64/to_f64 demotion probes.
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
# String Unicode surface: `unicode_normalize`/`unicode_normalized?` (the
# NFC/NFD/NFKC/NFKD algorithms + their derived tables) and grapheme-cluster
# segmentation (`grapheme_clusters`/`each_grapheme_cluster`, UAX #29). Both
# are the reference pure-Rust implementations of the Unicode annexes.
unicode-normalization = "0.1"
unicode-segmentation = "1"
# `digest` extension hashing (RustCrypto): pure-Rust, no system libs. Optional
# and pulled in only by the `ext-digest` cargo feature (see `[features]`), so a
# build without that feature carries none of them.
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
digest = { version = "0.10", optional = true }
# `zlib` extension: flate2's pure-Rust (miniz_oxide) backend powers
# `deflate`/`inflate`/`gzip`/`gunzip`. Pulled in only by `ext-zlib`.
flate2 = { version = "1", optional = true }
# `json` extension: serde_json parses into a `Value` tree we convert to
# `RubyValue` (generation is hand-rolled for int/float/bignum fidelity).
# Pulled in only by `ext-json`.
serde_json = { version = "1", optional = true }
# `psych`/`yaml` extension: yaml-rust2 is the maintained pure-Rust YAML 1.2
# parser+emitter (serde_yaml is deprecated/archived). Pulled in only by
# `ext-psych`.
yaml-rust2 = { version = "0.10", optional = true }
# The P-B core classes: `Process.clock_gettime`'s clock ids, and (for Time)
# `localtime_r`/`timegm`/`tzset` -- the zone database and DST rules the OS
# already owns. Deliberately libc rather than chrono: Time's strftime and
# zone semantics are CRuby-specific enough that a datetime crate's own
# opinions would have to be fought, not used (see the plan's P-E note).
libc = "0.2"

# One cargo feature per in-tree `ext/` extension (CRuby's ext/ model). Each
# feature compiles in its `ext/<name>.rs` module and its dispatch arms; with
# the feature off, the extension's code is absent from the binary. `ext-all`
# is the umbrella and `default` enables everything, so an out-of-the-box build
# has every extension and `require`ing one just works. Slim a binary with
# `--no-default-features --features ext-stringio,ext-json,...`.
#
# To ADD an extension, see the checklist in `src/ext/mod.rs`. In brief: an ABI
# row (spinel-abi), an `ext/<name>.rs` module, three cfg-gated dispatch arms in
# `builtins/mod.rs`, and one line here (+ its umbrella entry).
# Runtime string `eval`/`instance_eval`/`class_eval` (#97 stage 2) is ON by
# default: `eval` is core CRuby, not an in-tree extension, and the north star
# is full parity. A lean, parser-free binary is the explicit opt-OUT
# (`--no-default-features --features ext-all`); without `eval-vm` every
# dynamic-eval site answers `NotImplementedError`. Kept as its OWN feature
# (not folded into `ext-all`) so that opt-out is a single flag.
[features]
default = ["ext-all", "eval-vm"]
eval-vm = ["dep:ruby-prism"]
ext-all = [
    "ext-base64",
    "ext-stringio",
    "ext-strscan",
    "ext-cgi",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-openssl",
]
ext-base64 = []
ext-stringio = []
ext-strscan = []
ext-cgi = []
ext-digest = ["dep:md-5", "dep:sha1", "dep:sha2", "dep:digest"]
ext-json = ["dep:serde_json"]
ext-date = []
ext-zlib = ["dep:flate2"]
ext-psych = ["dep:yaml-rust2"]
ext-socket = []
ext-openssl = []
