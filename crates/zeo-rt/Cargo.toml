[package]
name = "zeo-rt"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
zeo-abi.workspace = true
# The multi-encoding string engine under `crate::enc`: StrBuf, transcode, the
# encoding tables.
encoding_rs.workspace = true
# The ruby_class!/ruby_module! DSL (compile-time) and its link-time registry.
# A class file declares its methods/constants once; linkme collects each
# table into `builtins::BUILTIN_TABLES`, which the routing consults ahead of
# the hand-written `ClassId`->lookup match tables (data-driven, no drift).
zeo-macros.workspace = true
linkme.workspace = true
# Runtime string `eval`: the SAME parser the compiler uses,
# linked into the runtime behind the `eval-vm` feature so a program that never
# evals a dynamic string carries none of it. The interpreter (`eval_vm.rs`)
# walks prism's `Node` tree directly against the existing dispatch/runtime
# primitives -- no shared HIR crate, no compile-time-resolved assumptions to
# undo.
ruby-prism = { workspace = true, optional = true }
parking_lot.workspace = true
indexmap.workspace = true
regex.workspace = true
# Backtracking regex engine for the constructs the linear-time `regex` crate
# structurally can't do -- in-pattern backreferences and look-around. Selected
# per-pattern (a pre-scan) so the common case keeps `regex`'s fast path.
fancy-regex.workspace = true
# Oniguruma bindings -- the backtracking engine that will replace fancy-regex
# (the engine CRuby's Onigmo forked from). default-features = false skips the
# bindgen `generate` feature (pre-generated bindings) and builds the VENDORED C
# library, never linking a system libonig.
onig.workspace = true
# The coroutine/current-yielder shim under `crate::coroutine`. Pinned to the
# 0.3.x line: the safety argument in
# `coroutine.rs` relies on an implementation invariant of corosensei's Yielder
# representation (a fixed slot on the coroutine's own stack) that is structural
# in 0.3.x but not a documented API guarantee -- re-verify before any bump.
corosensei.workspace = true
# OS entropy for `OpenSSL::Random`/`SecureRandom` -- the real extension draws
# from a CSPRNG, so we must too (getrandom(2)/SecRandomCopyBytes underneath).
getrandom.workspace = true
# The numeric tower: arbitrary-precision Integer. num-bigint
# over malachite (LGPL) / ibig (unmaintained); pure Rust, MIT/Apache, and
# BigInt's bitwise ops already implement Ruby's infinite-two's-complement
# semantics. num-integer supplies floored div/mod + gcd/lcm; num-traits the
# to_i64/to_f64 demotion probes.
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
# Time zone resolution (local offset / DST / abbreviation for an instant),
# pure Rust over the system zoneinfo rather than unsafe libc
# timegm/localtime_r/gmtime_r calls. The civil <-> epoch arithmetic itself is
# done in-tree (Howard Hinnant's algorithm), so jiff is consulted ONLY for the
# OS-dependent local timezone.
jiff.workspace = true
# String Unicode surface: `unicode_normalize`/`unicode_normalized?` (the
# NFC/NFD/NFKC/NFKD algorithms + their derived tables) and grapheme-cluster
# segmentation (`grapheme_clusters`/`each_grapheme_cluster`, UAX #29). Both
# are the reference pure-Rust implementations of the Unicode annexes.
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
# `digest` extension hashing (RustCrypto): pure-Rust, no system libs. Optional
# and pulled in only by the `ext-digest` cargo feature (see `[features]`), so a
# build without that feature carries none of them.
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
digest = { workspace = true, optional = true }
# `zlib` extension: flate2's pure-Rust (miniz_oxide) backend powers
# `deflate`/`inflate`/`gzip`/`gunzip`. Pulled in only by `ext-zlib`.
flate2 = { workspace = true, optional = true }

# `readline` extension: rustyline is the pure-Rust line editor behind
# `Readline.readline` on a terminal (non-tty reads bypass it entirely).
rustyline = { workspace = true, optional = true }
# `json` extension: serde_json parses into a `Value` tree we convert to
# `RubyValue` (generation is hand-rolled for int/float/bignum fidelity).
# Pulled in only by `ext-json`.
serde_json = { workspace = true, optional = true }
# `psych`/`yaml` extension: yaml-rust2 is the maintained pure-Rust YAML 1.2
# parser+emitter (serde_yaml is deprecated/archived). Pulled in only by
# `ext-psych`.
yaml-rust2 = { workspace = true, optional = true }
# `ffi` extension: libffi builds a call interface at runtime for variadic C
# functions (attach_function [..., :varargs]) and allocates closures so a Ruby
# Proc can be handed to a C callback argument. It vendors and builds its own C
# library, resolved through the same bare-rustc link as onig. Pulled in only by
# `ext-ffi`.
libffi = { workspace = true, optional = true }
# The P-B core classes: `Process.clock_gettime`'s clock ids, and (for Time)
# `localtime_r`/`timegm`/`tzset` -- the zone database and DST rules the OS
# already owns. Deliberately libc rather than chrono: Time's strftime and
# zone semantics are CRuby-specific enough that a datetime crate's own
# opinions would have to be fought, not used (see the plan's P-E note).
libc.workspace = true

# One cargo feature per in-tree `ext/` extension (CRuby's ext/ model). Each
# feature compiles in its `ext/<name>.rs` module and its dispatch arms; with
# the feature off, the extension's code is absent from the binary. `ext-all`
# is the umbrella and `default` enables everything, so an out-of-the-box build
# has every extension and `require`ing one just works. Slim a binary with
# `--no-default-features --features ext-stringio,ext-json,...`.
#
# To ADD an extension, see the checklist in `src/ext/mod.rs`. In brief: an ABI
# row (zeo-abi), an `ext/<name>.rs` module, three cfg-gated dispatch arms in
# `builtins/mod.rs`, and one line here (+ its umbrella entry).
# Runtime string `eval`/`instance_eval` is DELIBERATELY OUT of the
# default: `eval-vm` links `ruby-prism` (a C library, via bindgen/cc) into the
# final binary, and prism is the single largest size lever in the runtime -- a
# parser most programs never reach. So the default runtime is parser-free, and
# `zeo` does the work matz's interpreter can't: it statically detects whether
# a program can reach the runtime eval VM (`Hir::uses_runtime_eval`) and, only
# then, links a SEPARATE eval-enabled runtime variant (see `build::Runtime`).
# A program that uses `eval` still compiles and runs out of the box -- it just
# opts its OWN binary into carrying prism; every other binary stays lean. Kept as
# its own feature (not folded into `ext-all`) so the selector toggles one flag.
[features]
default = ["ext-all"]
eval-vm = ["dep:ruby-prism"]
ext-all = [
    "ext-base64",
    "ext-monitor",
    "ext-stringio",
    "ext-strscan",
    "ext-cgi",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-openssl",
    "ext-ffi",
    "ext-etc",
    "ext-pathname",
    "ext-fcntl",
    "ext-pty",
    "ext-syslog",
    "ext-readline",
]
ext-base64 = []
ext-etc = []
ext-fcntl = []
ext-pty = []
ext-syslog = []
ext-readline = ["dep:rustyline"]
ext-pathname = []
ext-monitor = []
ext-stringio = []
ext-strscan = []
ext-cgi = []
ext-digest = ["dep:md-5", "dep:sha1", "dep:sha2", "dep:digest"]
ext-json = ["dep:serde_json"]
ext-date = []
ext-zlib = ["dep:flate2"]
ext-psych = ["dep:yaml-rust2"]
ext-socket = []
ext-openssl = []
ext-ffi = ["dep:libffi"]

[lints]
workspace = true
