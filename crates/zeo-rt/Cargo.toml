[package]
name = "zeo-rt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Ruby runtime library statically linked into every binary the zeo compiler produces"
readme = "README.md"

# docs.rs must not build the vendored-C heavyweights: `ext-openssl` compiles
# OpenSSL 3.x from source and `ext-ffi` builds libffi -- both are timeout
# risks and neither adds documented API surface. Everything else (including
# the non-optional vendored oniguruma) builds fine.
[package.metadata.docs.rs]
no-default-features = true
features = [
    "ext-base64",
    "ext-monitor",
    "ext-stringio",
    "ext-strscan",
    "ext-cgi",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-etc",
    "ext-fcntl",
    "ext-io-console",
    "ext-pty",
    "ext-syslog",
    "ext-nkf",
    "ext-bigdecimal",
    "ext-coverage",
    "ext-tracepoint",
    "ext-prism",
]

[dependencies]
zeo-abi.workspace = true
# The multi-encoding string engine under `crate::enc`: StrBuf, transcode, the
# encoding tables.
encoding_rs.workspace = true
# The ruby_class!/ruby_module! DSL (compile-time) and its link-time registry.
# A class file declares its methods/constants once; linkme collects each
# table into `builtins::BUILTIN_TABLES`, which the routing consults ahead of
# the hand-written `ClassId`->lookup match tables (data-driven, no drift).
zeo-macros.workspace = true
linkme.workspace = true
# The parse-only surfaces (`RubyVM::AbstractSyntaxTree`,
# `InstructionSequence.compile`'s SyntaxError gate, the prism gem's native
# half). A run-time `eval` no longer reaches it here: zeo COMPILES a
# snippet, and the compiler links its own copy. Not optional -- the shipped
# runtime is one variant.
ruby-prism.workspace = true
ruby-prism-sys.workspace = true
parking_lot.workspace = true
indexmap.workspace = true
foldhash.workspace = true
# THE regex engine: Oniguruma, which CRuby's Onigmo forked from, speaking
# Ruby's own syntax (`Syntax::ruby()`). Every `Regexp` compiles and matches
# here -- one engine, so what it refuses ruby refuses and what it accepts
# ruby accepts, with no second dialect to translate into. default-features
# = false skips the bindgen `generate` feature (pre-generated bindings) and
# builds the VENDORED C library, never linking a system libonig.
onig.workspace = true
# Structured runtime logging. The FACADE only, and non-optional: with no
# subscriber installed an event is one relaxed load of a global, so a shipped
# program pays nothing measurable and the runtime can be instrumented freely.
# The compiler's own `--log-level`/`ZEO_LOG` already names `zeo_rt` in its
# filter (`main.rs` `widen_bare_level`), so a JIT run prints these today.
#
# The SUBSCRIBER is `runtime-logging`, off by default, because
# tracing-subscriber + env-filter is far larger than the binary-size gate's
# 256 KiB tolerance and every compiled program would carry it.
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# The coroutine/current-yielder shim under `crate::coroutine`. Pinned to the
# 0.3.x line: the safety argument in
# `coroutine.rs` relies on an implementation invariant of corosensei's Yielder
# representation (a fixed slot on the coroutine's own stack) that is structural
# in 0.3.x but not a documented API guarantee -- re-verify before any bump.
corosensei.workspace = true
# OS entropy for `OpenSSL::Random`/`SecureRandom` -- the real extension draws
# from a CSPRNG, so we must too (getrandom(2)/SecRandomCopyBytes underneath).
getrandom.workspace = true
# The numeric tower: arbitrary-precision Integer. num-bigint
# over malachite (LGPL) / ibig (unmaintained); pure Rust, MIT/Apache, and
# BigInt's bitwise ops already implement Ruby's infinite-two's-complement
# semantics. num-integer supplies floored div/mod + gcd/lcm; num-traits the
# to_i64/to_f64 demotion probes.
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true
# Time zone resolution (local offset / DST / abbreviation for an instant),
# pure Rust over the system zoneinfo rather than unsafe libc
# timegm/localtime_r/gmtime_r calls. The civil <-> epoch arithmetic itself is
# done in-tree (Howard Hinnant's algorithm), so jiff is consulted ONLY for the
# OS-dependent local timezone.
jiff.workspace = true
# String Unicode surface: `unicode_normalize`/`unicode_normalized?` (the
# NFC/NFD/NFKC/NFKD algorithms + their derived tables) and grapheme-cluster
# segmentation (`grapheme_clusters`/`each_grapheme_cluster`, UAX #29). Both
# are the reference pure-Rust implementations of the Unicode annexes.
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
# `digest` extension hashing (RustCrypto): pure-Rust, no system libs. Optional
# and pulled in only by the `ext-digest` cargo feature (see `[features]`), so a
# build without that feature carries none of them.
md-5 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
digest = { workspace = true, optional = true }
# `zlib` extension: flate2's pure-Rust (miniz_oxide) backend powers
# `deflate`/`inflate`/`gzip`/`gunzip`. Pulled in only by `ext-zlib`.
flate2 = { workspace = true, optional = true }

# `psych`/`yaml` extension: yaml-rust2 is the maintained pure-Rust YAML 1.2
# parser+emitter (serde_yaml is deprecated/archived). Pulled in only by
# `ext-psych`.
yaml-rust2 = { workspace = true, optional = true }
# `ffi` extension: libffi builds a call interface at runtime for variadic C
# functions (attach_function [..., :varargs]) and allocates closures so a Ruby
# Proc can be handed to a C callback argument. It vendors and builds its own C
# library, resolved through the same bare-rustc link as onig. Pulled in only by
# `ext-ffi`.
libffi = { workspace = true, optional = true }
# `openssl` extension: the official rust-openssl bindings over a vendored
# OpenSSL 3.x -- the same EVP digest/cipher/BN/TLS implementations CRuby's C
# extension binds, so behavior matches by construction. Pulled in only by
# `ext-openssl`.
openssl = { workspace = true, optional = true }
# The P-B core classes: `Process.clock_gettime`'s clock ids, and (for Time)
# `localtime_r`/`timegm`/`tzset` -- the zone database and DST rules the OS
# already owns. Deliberately libc rather than chrono: Time's strftime and
# zone semantics are CRuby-specific enough that a datetime crate's own
# opinions would have to be fought, not used (see the plan's P-E note).
libc.workspace = true

# One cargo feature per `ext/` library (CRuby's ext/ model). Each feature
# compiles in that library's Rust; with the feature off, its code is absent
# from the binary. `ext-all` is the umbrella and `default` enables everything,
# so an out-of-the-box build has every extension and `require`ing one just
# works. Slim a binary with
# `--no-default-features --features ext-stringio,ext-json,...`.
#
# This list is the ONLY hand-written half: build.rs declares the modules from
# the `ext/` tree itself. To ADD an extension see the checklist in `src/ext.rs`.
# cargo-machete greps for each crate name under `src/`. The ext crates are
# used only in `ext/*/ext/*/src/`, which build.rs wires in as modules, so
# machete never sees them; `md-5` is also imported as `md5`. All are used.
[package.metadata.cargo-machete]
ignored = ["md-5", "sha1", "sha2", "digest", "flate2", "yaml-rust2", "openssl"]

[build-dependencies]
# `csrc/cext_jmp.c`, built only under the `cext` feature. `cc` is already in
# the tree through onig and libffi, which vendor and build their own C
# libraries.
cc = "1"
# `$OUT_DIR/cext_layout.rs` -- the Rust mirror of the MRI structs the C
# extension views fill, read from the vendored headers. Already in the graph
# through `ruby-prism-sys`, so libclang is not a new build requirement.
bindgen = "0.72"

[features]
default = ["ext-all"]
# Install a `tracing` subscriber inside a COMPILED program, so
# `ZEO_LOG=zeo_rt=debug ./prog` prints the runtime's own events. Off by
# default: the subscriber is much larger than the binary-size gate allows,
# and a `zeo prog.rb` run already gets one from the compiler's `main`.
runtime-logging = ["dep:tracing-subscriber"]
ext-all = [
    "ext-base64",
    "ext-monitor",
    "ext-stringio",
    "ext-strscan",
    "ext-cgi",
    "ext-digest",
    "ext-json",
    "ext-date",
    "ext-zlib",
    "ext-psych",
    "ext-socket",
    "ext-openssl",
    "ext-ffi",
    "ext-etc",
    "ext-fcntl",
    "ext-io-console",
    "ext-pty",
    "ext-syslog",
    "ext-nkf",
    "ext-bigdecimal",
    "ext-coverage",
    "ext-tracepoint",
    "ext-prism",
    "cext",
]
# The C extension surface (`crates/zeo-rt/cext/`).
#
# ON by default as of C0. It was off while the surface was built, on the
# argument that an ext-free binary should stay byte-identical -- but a zeo
# that can COMPILE a gem's extension and then cannot load it is not a
# configuration anyone wants, and `zeo_rt_cext_load` sits in the capi symbol
# table either way, so nothing dead-strips regardless.
cext = []
ext-base64 = []
ext-prism = []
ext-coverage = []
ext-tracepoint = []
ext-etc = []
ext-fcntl = []
ext-io-console = []
ext-pty = []
ext-syslog = []
ext-nkf = []
ext-bigdecimal = []
ext-monitor = []
ext-stringio = []
ext-strscan = []
ext-cgi = []
ext-digest = ["dep:md-5", "dep:sha1", "dep:sha2", "dep:digest"]
ext-json = []
ext-date = []
ext-zlib = ["dep:flate2"]
ext-psych = ["dep:yaml-rust2"]
ext-socket = []
ext-openssl = ["dep:openssl"]
ext-ffi = ["dep:libffi"]

[lints]
workspace = true
