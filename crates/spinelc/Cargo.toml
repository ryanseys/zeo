[package]
name = "spinelc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ruby-prism = "1.9.0"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
prettyplease = "0.2"

[lib]
name = "spinelc"
path = "src/lib.rs"

[[bin]]
name = "spinelc"
path = "src/main.rs"
