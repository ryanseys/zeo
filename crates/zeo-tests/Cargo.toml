[package]
name = "zeo-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The golden + e2e harness LIBRARY (src/golden.rs, src/e2e_support.rs).
# The suite targets themselves live in crates/zeo/tests/, the package that
# owns the `zeo` binary and `libzeo.a` -- cargo rebuilds both before any
# suite runs, which is the freshness guarantee the harness once had to
# police by hand. Never published; `zeo` dev-depends on this crate
# (path-only, so the cycle is stripped from the .crate).
publish = false

[dependencies]
zeo.workspace = true
# `setrlimit` on the golden child: see MAX_CHILD_ADDRESS_SPACE in src/golden.rs.
libc.workspace = true
datatest-stable.workspace = true

[lints]
workspace = true
