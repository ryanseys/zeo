[package]
name = "zeo-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Proc-macros (ruby_class!/ruby_module!) that register built-in Ruby classes in the zeo-rt runtime"
documentation = "https://docs.rs/zeo-macros"
readme = "README.md"
# What the published `.crate` carries: the source, the two licences and the
# README. Tests and fixtures are for the repository, not for a consumer.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
# The `ruby_class! { ... }` proc-macro: parses the DSL with the shared
# zeo-dsl grammar and emits the runtime code (method fns, ClassId-keyed
# lookup tables, constant installers, and the linkme registration). See
# src/lib.rs.
zeo-dsl.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
# The isolated expand test mirrors the runtime contract (BuiltinClassTable +
# the BUILTIN_TABLES distributed slice) with stubs, so linkme is needed to
# prove the emitted registration actually collects at link time.
linkme.workspace = true

[lints]
workspace = true
