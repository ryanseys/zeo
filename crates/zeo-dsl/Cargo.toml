[package]
name = "zeo-dsl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The shared grammar for the `ruby_class! { ... }` DSL, parsed with `syn` so
# the SAME parser serves both the `zeo-macros` proc-macro (which emits runtime
# code) and `zeo`'s build.rs (which projects the compiler's `CLASS_SURFACE`) --
# one grammar, no drift between what the runtime registers and what the
# compiler folds against.
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[features]
# Source positions for `scan`. Off by default so `zeo-macros` -- which links
# this crate to expand every `ruby_class!` -- does not pay for proc-macro2's
# source map. The build tools in `xtask` turn it on; without it `Decl::line`
# reads 0 and nothing else changes.
spans = ["proc-macro2/span-locations"]

[lints]
workspace = true
