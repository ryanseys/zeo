[package]
name = "xtask"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The repo's own chores: staging, distribution, the C API headers, the golden oracle"

[dependencies]
flate2.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
# For `zeo::bundled` alone: the one place that decides which libraries ship,
# so `dist` and a compile can never disagree about the set.
zeo = { path = "../zeo" }
# The C API headers' pin and edits, which `cext` checks.
zeo-capi = { path = "../zeo-capi" }
