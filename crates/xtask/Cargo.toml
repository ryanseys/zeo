[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The dev-only task runner (`cargo xtask ...`); never published.
publish = false

[dependencies]
zeo.workspace = true
# `spans` gives the DSL scanner a file:line for each declaration. `zeo-macros`
# links zeo-dsl without it, so expanding every `ruby_class!` does not pay for a
# source map.
zeo-dsl = { workspace = true, features = ["spans"] }
# stage-publish: parses cargo's JSON message stream (serde_json) and packs
# the deterministic gems archive (tar + flate2).
serde_json.workspace = true
tar.workspace = true
flate2.workspace = true
# dist: rewrites the root manifest into the payload's runtime workspace, and
# checksums the release tarball.
toml_edit.workspace = true
sha2.workspace = true
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[lints]
workspace = true
