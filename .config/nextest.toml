# Every suite here compiles its `.rb` files and runs the result. That means
# CRANELIFT -- in-process for a JIT golden, plus one `cc` link for an AOT or
# e2e case. No `rustc` runs anywhere in the suite: the backend that shelled
# out to one was retired on 2026-08-21.
#
# What the group still bounds is therefore MEMORY, not toolchain processes:
# each golden spawns a child `zeo` that holds a compile arena, and the
# harness caps a child at 512 MiB of RSS (`run_bounded` in
# tests/support/golden.rs) because an allocating-but-silent child once ate
# 6.9 GB in 5.5 s. ONE group across all the suites, not one per suite: the
# bound that matters is how many children are alive in the whole run, and
# two groups of eight is sixteen.
#
# The width below was chosen when a test could launch a rustc, and has NOT
# been re-measured against the Cranelift path -- it is a ceiling nobody has
# shown is the right one, and now certainly a generous one. Re-measuring belongs to the perf pass, not to a
# correctness run. In practice the gate is run at `--test-threads 4` on a
# 16 GB machine, which sits under it anyway.
[test-groups]
golden = { max-threads = 10 }

# The default run is the DEV loop and stays fast: everything that compiles a
# whole gem's require graph is opted out here and runs only under `-P full`
# -- `cargo nextest run -p zeo-tests -P full` is the full gate's spelling.
# The gem probe owns broad whole-gem compile coverage; these two are the
# survivors with assertions the probe can't make.
[profile.default]
default-filter = "not (binary(gemtests) | test(every_bundled_gem_compiles))"

# The full gate: everything, including the whole-gem cases above.
[profile.full]
default-filter = "all()"

# Goldens that splice a whole require graph into one program are minutes of
# work whichever backend compiles them. Slow is not stuck, so they get their
# own deadline instead of raising the backstop for every other golden. (The
# per-gem programs that used to live in `tests/gems/` are gone -- whole-gem
# coverage is the gem probe's job, and each of those cases cost minutes of
# every suite run.)
#
# nextest resolves each setting from the first matching override, so these must
# precede the blanket one below.
#
# A gemtests case compiles a whole gem's require graph and runs a full test
# file; the harness's own cap stretches with it (ZEO_GOLDEN_RUN_DEADLINE=300
# set by the suite), so nextest's deadline must sit above both.
[[profile.default.overrides]]
filter = "binary(gemtests)"
test-group = "golden"
slow-timeout = { period = "360s", terminate-after = 2 }

# Backstop under the harness's own per-child cap, so a hung case can never
# wedge the whole run.
[[profile.default.overrides]]
filter = "binary(spinel) | binary(examples) | binary(gaps)"
test-group = "golden"
slow-timeout = { period = "60s", terminate-after = 3 }

# The CLI suite spawns the real `zeo` binary, which compiles the same way
# every golden does -- same group, same reasoning. No terminate: its
# minitest case legitimately compiles a whole require graph.
[[profile.default.overrides]]
filter = "binary(cli)"
test-group = "golden"

# `e2e` joins the group but keeps the default deadline. Its cases compile AND
# LINK whole programs -- the one tier that shells `cc` per test -- and some
# legitimately run past the goldens' 60s, so bounding its CONCURRENCY is the
# fix here; borrowing their timeout as well would convert machine pressure
# into spurious failures.
[[profile.default.overrides]]
filter = "binary(e2e)"
test-group = "golden"
