# nextest configuration.
#
# The golden suites (spinel/examples/gaps) each compile their `.rb` with zeo and
# invoke `rustc` on a cache MISS. On a cold `target/zeo-bin-cache` (a fresh
# checkout, or after a `zeo-rt` change invalidates the cache generation), running
# all ~2600 at the machine's full thread count launches that many concurrent
# rustc processes and the memory pressure sporadically fails a build. Capping the
# concurrency of these build-heavy tests (the old `xtask conformance run -j8`
# used the same bound) keeps a cold run reliable; a warm run just hard-links from
# the cache and is unaffected.

[test-groups]
golden = { max-threads = 8 }

[[profile.default.overrides]]
filter = "binary(spinel) | binary(examples) | binary(gaps)"
test-group = "golden"
# Backstop under the harness's own per-child byte cap and deadline (see
# `run_bounded` in tests/support/golden.rs). That bound handles a runaway
# compiled program; this one catches anything the harness itself gets stuck on,
# so a hung case can never wedge the whole run.
slow-timeout = { period = "60s", terminate-after = 3 }

# The vendored-gem goldens splice a whole require graph into one program --
# `net/http` alone reaches ~40 files -- and a cold `rustc` over that takes
# minutes on its own, several more when seven siblings are compiling beside it.
# Slow is not stuck, so these get their own deadline rather than dragging the
# backstop up for the other ~2600.
[[profile.default.overrides]]
filter = "binary(examples) & test(/^example::gem_/)"
slow-timeout = { period = "120s", terminate-after = 5 }
