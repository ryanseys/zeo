# Every suite here compiles its `.rb` with zeo and invokes `rustc` on a cache
# miss. Running them at full thread count launches that many concurrent rustc
# processes, and the memory pressure sporadically fails a build.
#
# ONE group across all of them, not one per suite: the bound that matters is
# how many rustc are alive at once in the whole run, and two groups of eight
# is sixteen. `e2e` is the largest suite by test count and was outside any
# group until this -- it ran at full width, each test able to launch a rustc.
[test-groups]
golden = { max-threads = 10 }

# The default run is the DEV loop and stays fast: everything that compiles a
# whole gem's require graph (minutes of rustc per case) is opted out here and
# runs only under `-P full` -- `cargo nextest run -p zeo-tests -P full` is the
# full gate's spelling. The gem probe owns broad whole-gem compile coverage;
# these four are the survivors with assertions the probe can't make.
[profile.default]
default-filter = "not (binary(gemtests) | test(every_bundled_gem_compiles) | test(rspec_end_to_end) | test(prism_surface))"

# The full gate: everything, including the whole-gem cases above.
[profile.full]
default-filter = "all()"

# Goldens that splice a whole require graph into one program take minutes in
# rustc alone. Slow is not stuck, so they get their own deadline instead of
# raising the backstop for every other golden. (The per-gem programs that
# used to live in `tests/gems/` are gone -- whole-gem coverage is the gem
# probe's job, and each of those cases cost minutes of every suite run.)
#
# nextest resolves each setting from the first matching override, so these must
# precede the blanket one below.
[[profile.default.overrides]]
filter = "binary(examples) & test(prism_surface)"
slow-timeout = { period = "120s", terminate-after = 5 }

# A gemtests case compiles a whole gem's require graph and runs a full test
# file; the harness's own cap stretches with it (ZEO_GOLDEN_RUN_DEADLINE=300
# set by the suite), so nextest's deadline must sit above both.
[[profile.default.overrides]]
filter = "binary(gemtests)"
test-group = "golden"
slow-timeout = { period = "360s", terminate-after = 2 }

# The rspec end-to-end golden splices the entire rspec stack (core,
# expectations, mocks, support, diff-lcs) into one program -- a cold compile
# runs minutes, like a gemtests case. Warm reruns hit the test bin-cache.
# No binary() anchor: it was born in gaps and lives in examples now, and an
# anchored pattern goes silently stale on promotion.
[[profile.default.overrides]]
filter = "test(rspec_end_to_end)"
test-group = "golden"
slow-timeout = { period = "360s", terminate-after = 2 }

# Backstop under the harness's own per-child cap (`run_bounded` in
# tests/support/golden.rs), so a hung case can never wedge the whole run.
[[profile.default.overrides]]
filter = "binary(spinel) | binary(examples) | binary(gaps)"
test-group = "golden"
slow-timeout = { period = "60s", terminate-after = 3 }

# The CLI suite spawns the real `zeo` binary, which compiles with rustc on a
# cache miss like every golden -- same group, same reasoning. No terminate:
# its minitest case legitimately compiles a whole require graph.
[[profile.default.overrides]]
filter = "binary(cli)"
test-group = "golden"

# `e2e` joins the group but keeps the default deadline. Its cases build whole
# programs and some legitimately run past the goldens' 60s, so bounding its
# CONCURRENCY is the fix here; borrowing their timeout as well would convert
# machine pressure into spurious failures.
[[profile.default.overrides]]
filter = "binary(e2e)"
test-group = "golden"
