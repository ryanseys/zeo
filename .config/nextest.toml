# The golden suites compile their `.rb` with zeo and invoke `rustc` on a cache
# miss. Running them all at full thread count launches that many concurrent
# rustc processes, and the memory pressure sporadically fails a build.
[test-groups]
golden = { max-threads = 8 }

# Goldens that splice a whole require graph into one program take minutes in
# rustc alone. Slow is not stuck, so they get their own deadline instead of
# raising the backstop for every other golden.
#
# nextest resolves each setting from the first matching override, so these must
# precede the blanket one below.
#
# A datatest name is the golden's path: renaming `tests/gems/` makes the
# anchored pattern match nothing, silently. `goldens_hygiene.rs` guards it.
[[profile.default.overrides]]
filter = "test(net_http) | test(net_smtp) | test(net_ftp)"
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "binary(examples) & (test(/^example::gems\\//) | test(prism_surface))"
slow-timeout = { period = "120s", terminate-after = 5 }

# Backstop under the harness's own per-child cap (`run_bounded` in
# tests/support/golden.rs), so a hung case can never wedge the whole run.
[[profile.default.overrides]]
filter = "binary(spinel) | binary(examples) | binary(gaps)"
test-group = "golden"
slow-timeout = { period = "60s", terminate-after = 3 }
