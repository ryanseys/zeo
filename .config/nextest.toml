# zeo-rt's unit tests require nextest's process-per-test execution model
# (the default): they mutate process-global state (the GATES word, the
# REGISTRY OnceLock, other set-once statics), and a fresh process per test
# is the isolation. Do not add a shared-process runner for them.
#
# Every corpus case spawns a child `zeo` holding a compile arena, and a
# runaway one can reach gigabytes in seconds; the harness caps a child's RSS
# (crates/zeo/tests/corpus/run.rs) and this group bounds how many are alive
# at once. ONE group across every binary that spawns a compile: the bound
# that matters is the whole run's children, not one binary's.
#
# The width is MEASURED (2026-08-24, aarch64-darwin 16GB):
#
#   width   6      10     14     20
#   secs    39.5   28.1   23.6   27.8   (20's second run hit 31.8: pressure)
#
# 14 is the knee: past it the extra children fight the machine instead of
# filling it. Re-measure after any change to what a child costs.
[test-groups]
golden = { max-threads = 14 }

# ONE run of the corpus is the whole corpus gate: every program compiles and
# runs once, and `cargo nextest run` is both the dev loop and the gate.
#
# What `-P full` adds is NOT another pass over the corpus -- it is the handful
# of tests that are individually slow: a release compiler build, a whole gem's
# require graph, a probe target dir of its own. Those are minutes each, so
# they stay out of the loop a person runs while editing.
[profile.default]
default-filter = """
not (
      test(/^milestones::/)
    | test(/^checks::binary_size::/)
    | test(every_bundled_gem_compiles)
    | test(natlibs_table_matches_rustc)
    | test(a_dependency_position_zeo_still_builds_the_staticlib)
)
"""

# Per-binary wall-clock lands in target/nextest/<profile>/junit.xml.
[profile.default.junit]
path = "junit.xml"

# The gate: everything, including the slow individual tests above.
[profile.full]
default-filter = "all()"

[profile.full.junit]
path = "junit.xml"

# nextest takes the first matching override, so the specific ones come first.

# Every milestone splices a whole require graph: minutes, and slow is not
# stuck. Sits above the harness's own 300s deadline.
[[profile.default.overrides]]
filter = "test(milestones::)"
test-group = "golden"
slow-timeout = { period = "360s", terminate-after = 2 }

# Backstop under the harness's per-child cap: a hung case cannot wedge the run.
[[profile.default.overrides]]
filter = "binary(corpus)"
test-group = "golden"
slow-timeout = { period = "60s", terminate-after = 3 }

# The `api` half of this binary spawns the real `zeo` and compiles like a
# corpus case; the `checks` half is in-process and cheap. One override for
# the binary is simpler than splitting it, and bounding a cheap test costs
# nothing. No terminate: some legitimately compile a whole require graph.
[[profile.default.overrides]]
filter = "binary(suite)"
test-group = "golden"
