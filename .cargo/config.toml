[alias]
xtask = "run --package xtask --"

# The floor under every `cargo build` in this tree, including the ones xtask
# shells out to without a `--jobs` of their own (`dist`, `stage-publish`, and
# the one-off `cargo build -p zeo` each sweep does before it starts).
#
# Two cores of headroom, same reasoning as `zeo::backend::job_cap`. The old
# hard cap of 6 existed for `[profile.release] codegen-units = 1`, which made
# every crate one whole-crate LLVM module; the workspace builds at
# codegen-units 16 now, so per-rustc memory peaks no longer threaten a 16 GB
# box at this width. (`CARGO_BUILD_JOBS` overrides either way.)
[build]
jobs = 10
