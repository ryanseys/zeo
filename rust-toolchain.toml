# Pinned so an ambient toolchain switch can't silently invalidate the entire
# target/ tree (mise.toml pins the same version for mise users).
[toolchain]
channel = "1.97.1"
# llvm-tools supplies the toolchain's llvm-profdata -- `cargo xtask dist --pgo`
# merges training profiles with it (profraw formats are LLVM-version-locked,
# so a system llvm-profdata is never an answer). clippy is what `make lint`
# runs; CI installs this file's toolchain and nothing else, so it rides here.
components = ["llvm-tools", "clippy"]
