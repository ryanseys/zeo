# Pinned so an ambient toolchain switch can't silently invalidate the entire
# target/ tree. This file is the ONE Rust pin; `.ruby-version` is the one Ruby
# pin, and both are read natively by rustup and by ruby/setup-ruby.
[toolchain]
channel = "1.97.1"
# llvm-tools supplies the toolchain's llvm-profdata -- `cargo xtask dist --pgo`
# merges training profiles with it (profraw formats are LLVM-version-locked,
# so a system llvm-profdata is never an answer). clippy is what `cargo xtask
# check` runs, and rustfmt is what `cargo xtask check-c-headers api` formats
# its tables with; CI installs this file's toolchain and nothing else, so
# both ride here.
components = ["llvm-tools", "clippy", "rustfmt"]
