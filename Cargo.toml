[workspace]
resolver = "3"
members = [
    "crates/zeo",
    "crates/zeo-abi",
    "crates/zeo-dsl",
    "crates/zeo-gem",
    "crates/zeo-macros",
    "crates/zeo-rt",
    "crates/zeo-capi",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/ryanseys/zeo"
repository = "https://github.com/ryanseys/zeo"
keywords = ["ruby", "compiler", "aot"]
categories = ["compilers", "command-line-utilities"]

[workspace.dependencies]
# The whole family is version-locked (`=`): the compiler emits code against an
# exact runtime surface, every emitted object is linked against that exact
# `libzeo.a`, and CLASS_SURFACE is projected from an exact zeo-rt revision.
# Anything looser invites drift crates.io cannot express. Releases bump all
# crates in lockstep.
zeo = { path = "crates/zeo", version = "=0.1.0" }
zeo-abi = { path = "crates/zeo-abi", version = "=0.1.0" }
zeo-rt = { path = "crates/zeo-rt", version = "=0.1.0", default-features = false }
zeo-capi = { path = "crates/zeo-capi", version = "=0.1.0" }
zeo-dsl = { path = "crates/zeo-dsl", version = "=0.1.0" }
zeo-gem = { path = "crates/zeo-gem", version = "=0.1.0" }
zeo-macros = { path = "crates/zeo-macros", version = "=0.1.0" }

# The Cranelift backend: zeo lowers HIR to CLIF itself and
# emits object files -- no rustc/LLVM in the compile path. Pinned to the
# wasmtime 47 release line; the quarterly bump is deliberate, never floating.
# `x86 + arm64` covers every dist triple; `host-arch` keeps a from-source
# build working anywhere Cranelift does.
cranelift-codegen = { version = "=0.134.3", features = ["x86", "arm64"] }
cranelift-frontend = "=0.134.3"
cranelift-module = "=0.134.3"
cranelift-object = "=0.134.3"
cranelift-native = "=0.134.3"
cranelift-jit = "=0.134.3"
cranelift-reader = "=0.134.3"
target-lexicon = "0.13"

# The parser: prism, CRuby's own default parser since 3.4.
ruby-prism = "1.9.0"
# The same parser's raw bindings, for the one field the safe crate does not
# expose: `pm_node_t.node_id`, which `RubyVM::AbstractSyntaxTree
# .node_id_for_backtrace_location` answers with.
ruby-prism-sys = "1.9.0"

# Diagnostics: typed compile errors, rendered as annotated source excerpts
# by the CLI ("fancy" = the graphical handler, which auto-degrades for
# pipes/NO_COLOR). insta pins the no-color rendering in snapshot tests.
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
insta = "1"

# Compiler instrumentation: level-gated `trace!`/`debug!`/`instrument` spans
# across the pipeline (loader -> lower -> analyze -> codegen). Zero output by
# default; the CLI installs a subscriber only when `ZEO_LOG`/`RUST_LOG` is set.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Object-file/executable reader. The link-ledger tests read a LINKED
# program's sections and symbols to assert what the link step kept (the
# linkme `BUILTIN_TABLES` elements) and what it dropped (the compiler).
object = "0.39"
# DWARF `.debug_line` for `-g` compiles (`clif/debuginfo.rs`). The version
# is the one `cranelift-object` already resolves to, so this adds a feature
# rather than a crate. A second, older `gimli` and `object` still reach the
# graph under miette's `backtrace`, which `deny.toml` lists by name.
gimli = "0.33"

# Data-driven tests: one `cargo test`/nextest case per golden `.rb` file
# (conformance corpus, examples, gaps). By nextest-rs, same ecosystem as the
# `cargo nextest` we already run.
datatest-stable = "0.3"
# The runtime performance bank (crates/zeo/benches). Lean build: no
# plotters/HTML; saved baselines + `critcmp` are the comparison story.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The one C build in the tree: zeo-capi's variadic entries (`csrc/*.c`).
cc = "1"

# Proc-macro toolkit for `zeo-macros`/`zeo-dsl` (`ruby_class!` parsing) and
# the compiler's identifier checks.
proc-macro2 = "1"
unicode-ident = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }

# Runtime foundations.
parking_lot = "0.12"
indexmap = "2"
libc = "0.2"

# Internal-map hashing (interner, dispatch registry, globals/constants):
# SipHash's DoS resistance buys nothing for process-internal keys, and these
# maps sit on the dynamic-dispatch hot path. Ruby-VISIBLE hashing
# (`Object#hash`) stays on DefaultHasher -- see collections.rs.
foldhash = "0.1"

# The global allocator STATICALLY-linked generated binaries opt into (the
# `zeo_static_alloc` cfg the backend passes for `-o` builds): Ruby workloads
# are allocation-heavy (every Arc payload, String, Vec), and mimalloc
# reliably beats system malloc there. Dynamic-linked binaries keep the
# system allocator -- rustc's allocator shims resolve inconsistently across
# an exe/dylib pair, and a cross-allocator free aborts in libmalloc.
mimalloc = "0.1"

# Link-time auto-registration: the `ruby_class!` macro registers each class's
# method/constant table into a `BUILTIN_TABLES` distributed slice the runtime
# collects, replacing the hand-written `ClassId`->lookup match tables.
linkme = "0.3"
getrandom = "0.3"
corosensei = "0.3"

# The multibyte CJK mapping backend (zeo-enc): Shift_JIS/EUC-JP/GBK/Big5
# tables via WHATWG's encoding_rs. Structural validity is zeo-enc's own
# CRuby-faithful walk; encoding_rs supplies only the byte<->Unicode mapping.
encoding_rs = "0.8"

# The Ruby regex engine (zeo-rt): Oniguruma, vendored and built by the onig
# crate. `regex` is xtask tooling only (golden scrubbing) and never reaches
# the runtime.
onig = { version = "6.5", default-features = false }
regex = "1"

# libffi vendors and builds its own C library (like onig), for the runtime
# variadic-call / callback-closure paths of the `ffi` gem (ext-ffi only).
libffi = "5"

# Numeric tower.
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"

# Time zones and Unicode surfaces.
jiff = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"

# The embedded-gems archive of a registry-installed zeo: tar + gzip (flate2's
# pure-Rust miniz_oxide backend). `cargo xtask stage-crate` packs it; the zeo
# binary extracts it on first run. serde_json also parses cargo's
# --message-format=json stream for the registry runtime build.
tar = "0.4"


# ext/ backends (feature-gated in zeo-rt).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.11"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml-rust2 = "0.10"
openssl = { version = "0.10", features = ["vendored"] }

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"
# Every `unsafe` block states why it is sound. The audit runs behind a
# per-crate ratchet (`checks::hygiene`), so the count can only go down.
undocumented_unsafe_blocks = "warn"

# `line-tables-only` everywhere, not just for dependencies:
# `[profile.dev.package."*"]` covers DEPENDENCIES only, and the workspace's
# own crates are large. Full DWARF is the memory-hungry part of a rustc
# process and the bulk of what makes `target/` reach tens of gigabytes. A
# line table still carries file and line for a backtrace, which is what
# anything here is read for.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# The suite runs the compiler it just built, 5,900 times, so how well these
# two are optimized IS the cost of a test run -- and not only in the tail:
# `zeo --version` is 10ms, so of the ~50ms floor on a trivial case about
# 40ms is compiler work.
#
# MEASURED, unoptimized against target/dist/zeo, same programs, serial:
#   lang/methods/undef_method_reflection.rb    0.06s -> 0.07s  (floor-bound)
#   core/io/an_io_reopen_onto_a_file_fails.rb  1.65s -> 0.26s  (6.3x)
#   lang/exceptions/deep_object_chain_release  4.28s -> 0.46s  (9.3x)
#   stdlib/digest/big5_and_euc_jp_encode…      9.94s -> 0.80s  (12.4x)
#
# `zeo-rt` earns its row as much as `zeo` does: it is linked into every
# compiled program, so it is the RUNTIME half, and the digest case above is
# mostly runtime. `cargo xtask timings` is how the trade was priced and is
# how to re-price it.
[profile.dev.package.zeo]
opt-level = 2

[profile.dev.package.zeo-rt]
opt-level = 2

# Package overrides never reach build scripts or proc-macros, so without these
# `zeo-macros` (240 ruby_class! expansions over the whole runtime), zeo's
# build.rs (parses and hashes megabytes per rerun), bindgen and openssl-src's
# driver all ran at -O0 on every rebuild in every target dir.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2

# codegen-units 16 in release: at 1, zeo-rt (114k lines) is a single LLVM
# module -- one thread for minutes, with a memory peak that oversubscribes
# a parallel build. The zeo-rt override below keeps the runtime at 1 so it
# gets its cross-unit inlining without LTO.
#
# No `lto` here. Measured 2026-08-22, release/release over all 61 benches,
# three runs each: thin LTO is geomean -0.02%, a null result with a scatter
# of +-3% either way. It costs a 74s release build turning into 3m06s and
# `libzeo.a` growing 78.5 MB -> 175.8 MB, paid once per shipped triple.
# `[profile.dist]` keeps it: paid once per release, where the build time
# does not matter.
[profile.release]
strip = "symbols"
codegen-units = 16

[profile.release.package.zeo-rt]
codegen-units = 1

# `cargo xtask dist` artifacts only: maximum optimization, paid once per release.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "thin"
