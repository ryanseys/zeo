[workspace]
resolver = "2"
members = [
    "crates/zeo",
    "crates/zeo-abi",
    "crates/zeo-rt",
    "crates/zeo-fiber",
    "crates/xtask",
]

[workspace.package]
edition = "2021"
license = "MIT"

# Faster generated-program compiles + faster zeo-rt rebuilds. Every compiled
# program links the runtime; it is a large, rarely-step-debugged artifact, so trim
# its debug info. `line-tables-only` keeps panic backtraces and line numbers -- only
# interactive lldb step-through of the runtime is lost.
[profile.dev.package.zeo-rt]
debug = "line-tables-only"

# All third-party dependencies (regex, ruby-prism, num-bigint, may, ...): build them
# optimized ONCE (they change rarely) and drop full debug info. Shrinks the linked
# runtime and speeds its execution; one-time rebuild cost, no effect on incremental
# rebuilds of the workspace crates themselves.
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# The runtime a SHIPPED binary links (`zeo foo.rb -o app` builds zeo-rt in
# release and statically links it -- see build.rs's Profile). Optimized and stripped
# so user binaries are small and fast, instead of embedding the ~10MB unoptimized
# debug runtime. All behavior-preserving: NOT panic="abort" (the `may` coroutine
# scheduler, catch_break/fiber unwinding, and deliberate divide-by-zero panics as a
# control path all require panic=unwind).
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
