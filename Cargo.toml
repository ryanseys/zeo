[workspace]
resolver = "2"
members = [
    "crates/zeo",
    "crates/zeo-abi",
    "crates/zeo-enc",
    "crates/zeo-hir",
    "crates/zeo-rt",
    "crates/zeo-fiber",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
# MSRV floor: edition 2024 needs >=1.85; the runtime uses std APIs stabilized
# through 1.87 (f64::next_up, u{n}::is_multiple_of). Checked in CI; bump
# deliberately.
rust-version = "1.87"
license = "MIT OR Apache-2.0"

# Every third-party version is declared ONCE here; members inherit with
# `dep = { workspace = true }` (adding `optional = true` locally where a
# cargo feature gates the dep). Feature selections and default-features
# choices live HERE, at the declaration, per cargo's inheritance rules.
[workspace.dependencies]
# Path deps between workspace crates, so members spell them uniformly.
zeo = { path = "crates/zeo" }
zeo-abi = { path = "crates/zeo-abi" }
zeo-enc = { path = "crates/zeo-enc" }
zeo-fiber = { path = "crates/zeo-fiber" }
zeo-hir = { path = "crates/zeo-hir" }
# The parser: prism, CRuby's own default parser since 3.4.
ruby-prism = "1.9.0"
# Diagnostics: typed compile errors, rendered as annotated source excerpts
# by the CLI ("fancy" = the graphical handler, which auto-degrades for
# pipes/NO_COLOR). insta pins the no-color rendering in snapshot tests.
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
insta = "1"
# Codegen: Rust emitted as TokenStreams, formatted for humans.
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
prettyplease = "0.2"
# Runtime foundations.
parking_lot = "0.12"
indexmap = "2"
libc = "0.2"
pastey = "0.1"
getrandom = "0.3"
corosensei = "0.3"
# The multibyte CJK mapping backend (zeo-enc): Shift_JIS/EUC-JP/GBK/Big5
# tables via WHATWG's encoding_rs. Structural validity is zeo-enc's own
# CRuby-faithful walk; encoding_rs supplies only the byte<->Unicode mapping.
encoding_rs = "0.8"
# Regex engines (regexp.rs docs cover the split; onig vendors its C library).
regex = "1"
fancy-regex = "0.14"
onig = { version = "6.5", default-features = false }
# Numeric tower.
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
# Time zones and Unicode surfaces.
jiff = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
# ext/ backends (feature-gated in zeo-rt).
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
flate2 = "1"
serde_json = "1"
yaml-rust2 = "0.10"

# The workspace-wide lint gate (each member opts in with `[lints] workspace =
# true`). Warnings are errors in CI (`cargo clippy -- -D warnings`); the lint
# LEVELS here stay `warn` so local iteration isn't interrupted mid-edit.
[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = "warn"

# Faster generated-program compiles + faster zeo-rt rebuilds. Every compiled
# program links the runtime; it is a large, rarely-step-debugged artifact, so trim
# its debug info. `line-tables-only` keeps panic backtraces and line numbers -- only
# interactive lldb step-through of the runtime is lost.
[profile.dev.package.zeo-rt]
debug = "line-tables-only"

# All third-party dependencies (regex, ruby-prism, num-bigint, may, ...): build them
# optimized ONCE (they change rarely) and drop full debug info. Shrinks the linked
# runtime and speeds its execution; one-time rebuild cost, no effect on incremental
# rebuilds of the workspace crates themselves.
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# The runtime a SHIPPED binary links (`zeo foo.rb -o app` builds zeo-rt in
# release and statically links it -- see build.rs's Profile). Optimized and stripped
# so user binaries are small and fast, instead of embedding the ~10MB unoptimized
# debug runtime. All behavior-preserving: NOT panic="abort" (the `may` coroutine
# scheduler, catch_break/fiber unwinding, and deliberate divide-by-zero panics as a
# control path all require panic=unwind).
#
# NO `lto`: with profile LTO on, cargo builds the release rlibs as bitcode-only
# objects (deferring codegen to the final cargo link), but generated programs
# link those rlibs through a bare `rustc` call (`build_binary`) with no LTO
# step -- Apple's `ld` then feeds the bitcode to its own libLTO, which breaks
# whenever its LLVM lags rustc's ("could not parse bitcode object file",
# rustc 1.97/LLVM 22 vs Apple libLTO LLVM 21). `codegen-units = 1` already
# provides whole-crate optimization.
[profile.release]
strip = "symbols"
codegen-units = 1
