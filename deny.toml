# cargo-deny configuration: license allowlist + RustSec advisories for the
# whole dependency tree (including what ships inside every compiled program
# via zeo-rt). Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive-only: zeo is MIT OR Apache-2.0 and must impose nothing more on
# programs it compiles. Notably ABSENT: LGPL/GPL (e.g. malachite) -- adding a
# copyleft dep should fail here loudly and be a deliberate decision.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  # Boost, reached through rustyline -> clipboard-win/error-code. Permissive,
  # OSI-approved, and its attribution clause exempts binary distribution.
  "BSL-1.0",
]

# An allowed license that nothing currently uses is a warning by default. That
# is noise here: this list is deliberately broader than today's tree, so a new
# permissive dependency does not fail CI for a license we would have accepted.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
