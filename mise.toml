[tools]
ruby = "4.0.5"
rust = "1.97.1"

[tasks.build]
description = "Build the CLI"
run = "cargo build"

[tasks.zeo]
description = "Run zeo cli"
run = "cargo run"

[tasks.conformance]
description = "Run the golden conformance suites (spinel corpus + examples + gaps)"
run = "cargo nextest run -p zeo --test spinel --test examples --test gaps"

# The e2e suite links generated programs against the RELEASE runtime; prebuild
# both variants first so nextest's per-test processes don't race `cargo build`
# (nextest itself only builds crates in debug). Set ZEO_RUNTIME_PROFILE=debug
# for a symbolicated runtime when chasing a panic.
[tasks.e2e]
description = "Run the e2e test suite (prebuilds the release runtime)"
run = [
  "cargo build -p zeo-rt --release",
  "cargo build -p zeo-rt --release --features eval-vm --target-dir target/zeo-rt-eval",
  "cargo nextest run -p zeo",
]
