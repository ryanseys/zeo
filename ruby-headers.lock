# MRI's public C API headers -- the one pin in this repo that is not a gem.
#
# zeo compiles a gem's `ext/**/*.c` from source against these, so a prebuilt
# MRI `.so` never loads. The vendored tree under `crates/zeo-rt/cext/include`
# is upstream verbatim plus `crates/zeo-rt/cext/patches/`, which turns the
# layout-reading macros into calls. `cargo xtask cext sync --check` proves the
# tree is exactly that sum, and `crates/zeo/tools-lib/mkmf.rb` rides the same
# pin.
#
# `rev` is what the tag resolved to when it was recorded. A fetch that lands
# on a different commit is refused, so a moved tag cannot slip in.

repo = https://github.com/ruby/ruby
tag = v4.0.6
rev = 03b6d3f8898a28604fe6cb00eae3226b821168f4
subdir = include
