version: 2
updates:
  # Cargo only. The ruby half is a `Gemfile` whose every entry is pinned
  # exactly, on purpose: the same lock decides what zeo vendors AND what the
  # ruby oracle resolves, so a bump is a deliberate act followed by a golden
  # run, never a routine PR. `bundler` here would fight that.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps. A dependency that lands in every
      # compiled program deserves review as a set, not one PR at a time.
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
