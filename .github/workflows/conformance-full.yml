name: Conformance (full)

# The whole vendored corpus (~2,300 tests, each an independent rustc link) --
# too slow for per-PR CI, so it runs nightly and on demand. The per-PR smoke
# tier lives in ci.yml.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- conformance run
        timeout-minutes: 120
