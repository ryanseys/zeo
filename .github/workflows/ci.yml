name: CI

# Every commit gets the WHOLE answer: `cargo xtask check` for the shape checks
# and the full nextest profile for the tests, split four ways so a job stays
# near a quarter of an hour. One tier, so a red board never means "and the
# rest runs tonight".
#
# Nothing here installs Ruby. Ruby records a program's answer under its
# `__END__`; running one needs only the committed trailer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes the run in flight, on main too: with commits landing
# minutes apart, only the newest answer is worth the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # clippy, cargo deny, cargo machete, the four C API header checks, the
  # doctests and the optional-feature builds. One command, and it runs every
  # step even after one fails, so a red board says everything at once.
  ci:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      # Pinned. `@latest` here and whatever `cargo install` left on a dev box
      # is two versions of the same meter.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0,cargo-machete@0.9.2
      # No `cargo fmt --check` gate, deliberately: holding the tree
      # rustfmt-clean is not worth failing a build over -- style drift is a
      # review comment, not a red X. See CONTRIBUTING.md.
      - run: cargo xtask check

  test:
    name: test ${{ matrix.partition }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: ./.github/actions/deps

      # Build first: `zeo` is a BINARY target, and nothing gives a test target
      # a cargo dependency edge to one -- so the suites would happily run
      # yesterday's compiler. This produces both the `zeo` the corpus harness
      # spawns and the `libzeo.a` every AOT link needs.
      - run: cargo build --workspace

      # The full profile: every corpus suite on the JIT, the AOT and memcheck
      # legs, the differentials, the whole-graph milestones and the C-gem
      # sweep. nextest's hash partition is deterministic, so a red case
      # reproduces locally with the same number. A fixed gap fails here and
      # says which command promotes it.
      - run: cargo nextest run -P full --no-fail-fast --partition hash:${{ matrix.partition }}/4

      # One file to triage a red run from, instead of a 20,000-line log.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/full/junit.xml
          if-no-files-found: ignore

  msrv:
    name: MSRV check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Deliberately OVERRIDES rust-toolchain.toml (the action exports
      # RUSTUP_TOOLCHAIN): this job checks the `rust-version` floor, not the
      # pin. So it does not use the shared rust action, which installs the pin.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: echo "CARGO_BUILD_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"
      - run: cargo check --workspace --all-features
