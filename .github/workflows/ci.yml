name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The lossy-UTF-8 ratchet: `to_utf8_lossy` in the runtime is a
      # DISPLAY-path convenience that silently corrupts non-UTF-8 semantic
      # operations; the audit migrates sites onto byte/encoding-aware paths
      # one by one. The count may only go DOWN -- lower the limit as sites
      # are converted; never raise it.
      - name: lossy-UTF-8 ratchet
        run: |
          count=$(grep -rn "to_utf8_lossy" crates/zeo-rt/src --include="*.rs" | wc -l)
          limit=211
          echo "to_utf8_lossy sites in zeo-rt: $count (limit: $limit)"
          if [ "$count" -gt "$limit" ]; then
            echo "::error::to_utf8_lossy count grew ($count > $limit) -- new runtime code must use byte/encoding-aware paths"
            exit 1
          fi

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The workspace unit + e2e tests. The e2e suite compiles generated
      # programs against the prebuilt RELEASE runtime (small stripped rlib ->
      # far cheaper per-test link), so build both runtime variants first to keep
      # nextest's parallel test processes from racing the one cargo build.
      # `cargo nextest` builds crates only in debug, so the release rlib won't
      # exist unless built explicitly here. The Eval variant lives in its own
      # target dir (see `build::variant_target_dir`).
      - run: cargo build -p zeo-rt --release
      - run: cargo build -p zeo-rt --release --features eval-vm --target-dir target/zeo-rt-eval
      - run: cargo nextest run --workspace
      # nextest doesn't run doctests; keep them covered.
      - run: cargo test --workspace --doc
      # The examples/ golden suite + the gaps XFAIL tracker now run under
      # `cargo nextest run --workspace` above (datatest-stable targets:
      # tests/examples.rs, tests/gaps.rs) -- committed .expected, no ruby in CI.
      # The conformance smoke tier: ~150 representative tests from the
      # vendored corpus (committed .expected snapshots, so no ruby needed).
      # The full 2,295-test run is the nightly job.
      - run: cargo run -p xtask -- conformance run --smoke

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features
