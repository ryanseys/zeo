name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `rustup toolchain install` with no argument reads rust-toolchain.toml,
      # so CI builds with the SAME pinned toolchain as every dev machine and
      # there is no second copy of the pin to drift.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # No `cargo fmt --check` gate, deliberately. The tree IS rustfmt-clean
      # (a5fc1ca0), but holding it clean is not worth failing a build over --
      # style drift is a review comment, not a red X. See CONTRIBUTING.md.
      - run: make check
      # The lossy-UTF-8 ratchet: `to_utf8_lossy` in the runtime is a
      # DISPLAY-path convenience that silently corrupts non-UTF-8 semantic
      # operations; the audit migrates sites onto byte/encoding-aware paths
      # one by one. The count may only go DOWN -- lower the limit as sites
      # are converted; never raise it.
      #
      # RE-BASELINED ONCE, 2026-07-31, 211 -> 279, with the reason recorded
      # (the rule above is "never raise it QUIETLY"). Two facts forced it.
      # First, the limit was set at 189 sites and the openssl/zlib/socket/ffi/
      # date/bigdecimal extensions landed since, each bringing its own display
      # paths -- almost none of the growth is in the files the audit targets.
      # Second, and more important, THIS COUNT DOES NOT MEASURE THE HARM: the
      # encoding-correctness work took measured divergences from ruby 4.0.6
      # from 105 to 27 while moving this number 277 -> 279, because the fixes
      # re-encode results that are still read through a lossy decode. The
      # count also includes comments, test asserts and the definition itself,
      # and it MISSES `chars()`/`char_vec()`, which are built on
      # `to_utf8_lossy` and are just as lossy -- so a site can lower it with
      # no semantic gain at all.
      #
      # docs/ROADMAP.md carries the measured audit and tests/gaps/ holds the
      # executable record of what is still wrong. Prefer those as the ratchet;
      # this line is a backstop against unbounded growth, nothing finer.
      - name: lossy-UTF-8 ratchet
        run: |
          count=$(grep -rn "to_utf8_lossy" crates/zeo-rt/src --include="*.rs" | wc -l)
          limit=279
          echo "to_utf8_lossy sites in zeo-rt: $count (limit: $limit)"
          if [ "$count" -gt "$limit" ]; then
            echo "::error::to_utf8_lossy count grew ($count > $limit) -- new runtime code must use byte/encoding-aware paths"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml -- same pin as every dev machine.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The test legs live in the Makefile -- `make gate` composes the same
      # ci-* targets, so what the phase gate runs and what CI runs cannot
      # drift. Each recipe's rationale is a comment on its target there.
      #
      # `make` first: `zeo` is a BINARY target, and nothing gives a test
      # target a cargo dependency edge to one -- so the suites would happily
      # run yesterday's compiler. The build produces both the `zeo` the
      # golden harness spawns and the `libzeo.a` every AOT link needs.
      - run: make

      # Cranelift through the in-process JIT, one `zeo` child per golden.
      - run: make ci-jit

      # The same CLIF through an object file and a real link -- what SHIPS.
      - run: make ci-aot

      # One instrumented corpus pass: the compiled-ownership ledger AND the
      # cycle census together (the two compose; verified 2026-08-25). The
      # whole-gem gemtests half of the census belongs to `make gate` (the
      # nextest default-filter excludes `binary(gemtests)`, so listing it
      # here would silently run nothing -- which is exactly what happened).
      - run: make ci-memcheck

      # The hand-written native-library table vs rustc's live answer.
      # Linux only: it is where the table was wrong (`-lcrypt` missing)
      # while macOS stayed green.
      - run: make ci-natlibs
        if: runner.os == 'Linux'

      # The anchor-workspace claim about cargo. One platform is enough.
      - run: make ci-anchor
        if: runner.os == 'macOS'

      # The umbrella entry points, one named case each (tests/milestones/).
      # `require "rubygems"` working is the point of a whole effort, so a
      # regression must name itself here rather than arrive as one line inside
      # a bigger suite. Each case splices a whole library's require graph, so
      # this is minutes rather than seconds and the nextest default-filter
      # excludes the binary -- the leg passes `-P full` for exactly that
      # reason, the same trap `make ci-memcheck` fell into with gemtests.
      - run: make ci-milestones

      # nextest doesn't run doctests; keep them covered.
      - run: make ci-doc

      # Every `ext-*` feature really is optional. The docs.rs configuration
      # omits `ext-ffi` and had stopped compiling with nobody watching.
      - run: make ci-features

      # The tests/ golden suites -- examples, the full ~3,010-test spinel corpus,
      # and the gaps XFAIL tracker -- all run under `make ci-jit` above
      # (datatest-stable targets tests/{examples,spinel,gaps}.rs) --
      # committed ruby-oracle .expected, no ruby in CI. The `golden` test-group
      # (.config/nextest.toml) caps their concurrency. A fixed gap fails CI as
      # an XPASS (promote it).
      #
      # NOT run here: the rest of the `-P full` profile's whole-gem cases
      # (gemtests, every_bundled_gem_compiles). They compile entire require
      # graphs and belong to the phase gate -- `make gate` runs them. The
      # milestones leg above is the exception, and deliberately so: it is the
      # one whole-graph suite whose subject is a headline claim.
  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Deliberately OVERRIDES rust-toolchain.toml (the action exports
      # RUSTUP_TOOLCHAIN): this job checks the `rust-version` floor, not the pin.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # Everything that guards the shape of what gets PUBLISHED. These are cheap
  # and independent of the test matrix, so they share one job.
  release-hygiene:
    name: release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml -- same pin as every dev machine.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete

      # Permissive licenses only, and no yanked or advisory-flagged crate.
      # zeo-rt ships inside every compiled program, so its tree is the user's
      # tree. See deny.toml.
      - run: cargo deny check

      # An unused dependency still ships in the .crate file and still has to
      # be audited. `md-5` is ignored in zeo-rt's manifest because the crate
      # is imported under a different name; every other exception should be
      # a deletion instead.
      - run: cargo machete

      # Binary size was prose until now: every figure in the docs was a
      # number someone measured once and typed. `puts 1` is the floor every
      # program pays, and a table added to the always-on set moves it for
      # every program at once -- silently, because nothing fails.
      - run: make ci-size

      # A file this large in the working tree is almost always a build
      # artifact committed by mistake. History was rewritten to strip blobs
      # over this size, so re-introducing one undoes that work.
      # A `while read` loop, not `xargs -I{} sh -c`: that form blew up with
      # "command line cannot be assembled, too long" on this many files and
      # reported NOTHING, which read as a pass while three 13MB binaries sat
      # in HEAD.
      - name: no tracked file over 1MB
        run: |
          big=$(git ls-files -z | while IFS= read -r -d '' f; do
            s=$(wc -c < "$f")
            [ "$s" -gt 1048576 ] && echo "$s $f"
          done | sort -rn)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 1MB:"; echo "$big"; exit 1
          fi
          echo "no tracked file over 1MB"

      # Each vendored gem must still match the commit upstream.rb pins, so a
      # hand-edit to gems/ cannot silently diverge from its upstream source.
      - run: tools/zeo-dev gem sync --check

      # The MRI C API headers are upstream verbatim PLUS a patch series, and
      # both halves are load-bearing: the verbatim half is what makes a gem's
      # ext/ compile at all, and the patch half is what stops it reading a
      # struct layout zeo does not have. A hand-edit to a vendored header
      # would be invisible in review among 194 files, so the sum is checked.
      - run: tools/zeo-dev cext sync --check

      # `cext/api.rs` and `cext/stubs.rs` are both generated from
      # clang's AST of those headers, so a re-vendor moves them and a new
      # `rb_*` implementation retires a stub. Stale either way means a gem
      # fails to LINK, with a message naming a symbol and no file or line.
      - run: tools/zeo-dev cext api --check

      # The forwarding table is a set of CLAIMS that MRI's `rb_x` is exactly
      # `Class#method`. The claims are verified against the oracle by
      # `cext forward --reverify`, which needs ruby 4.0.6 and so never runs
      # here; what CI checks is that the committed table and the generated
      # Rust still agree.
      - run: tools/zeo-dev cext forward --check

      # The published `zeo` crate carries pregenerated artifacts that its
      # build script would otherwise derive from sibling crates absent from
      # the .crate file. This fails if they drift from their sources.
      - run: cargo xtask stage-publish --check

      # Stage the payload without building it: proves the tree lays out and
      # the docs and gems copy. The archive and the compile-and-run smoke test
      # need a dist-profile build, which the release workflow does.
      - run: cargo xtask dist --stage-only

      # `cargo package --list`, NOT `cargo package`. Both `cargo package` and
      # `cargo publish --dry-run` resolve each dependency's version
      # requirement against the real crates.io index, even with --no-verify.
      # The internal deps are pinned `=0.1.0` and are not published, so those
      # commands fail with "no matching package named zeo-abi" for every crate
      # above the leaves. `--list` reads the manifest and walks the file set
      # without touching the index, which is what this gate is actually for:
      # proving the manifest parses and the right files ship.
      #
      # `zeo` is the one that matters. Its build script needs the two
      # pregenerated artifacts, because the sibling crates it would otherwise
      # read are absent from the .crate file.
      - name: packages list cleanly and carry their pregen artifacts
        run: |
          cargo xtask stage-publish
          for c in zeo-abi zeo-dsl zeo-macros zeo-rt zeo; do
            n=$(cargo package -p "$c" --list --allow-dirty | wc -l)
            echo "$c: $n files"
          done
          for f in gems.pregen.tar.gz src/class_surface.pregen.rs; do
            cargo package -p zeo --list --allow-dirty | grep -qx "$f" \
              || { echo "::error::zeo package is missing $f"; exit 1; }
          done
          echo "zeo carries both pregen artifacts"
