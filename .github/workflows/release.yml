name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed against a branch without cutting a tag. The
  # artifacts upload, but no GitHub Release is created.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag must not publish something the suite has never seen. Linux is the
  # tier every pull request already runs, so this is a re-run rather than a
  # new opinion -- but a tag can be cut from any commit, including one that
  # never went through a pull request.
  test:
    name: test before publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: ./.github/actions/deps
      - run: cargo build --workspace
      - run: cargo nextest run -P full --no-fail-fast

  # Every target builds natively. Cross-compiling zeo-rt is not worth it: the
  # runtime links C (Prism, Oniguruma, OpenSSL, libffi), and `cargo xtask dist`
  # finishes with a smoke test that COMPILES AND RUNS a Ruby program with the
  # staged binary -- which a cross build could not do at all.
  dist:
    name: dist (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # The Intel runner is what makes this row NATIVE. Building it on
          # an arm64 runner would be a cross build, which the note above
          # rules out.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      # The same toolchain, cache and job count every other workflow uses. It
      # reads rust-toolchain.toml, so a release builds with the pin rather
      # than whatever stable is the day the tag lands.
      - uses: ./.github/actions/rust

      # zeo-rt's C dependencies. macOS gets these from the SDK already.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # The bundled stdlib comes out of the gem store, so the payload cannot
      # be staged without it. No ruby is involved: `deps` fetches the `.gem`
      # files the lock names and verifies each against the lock's checksum.
      - uses: ./.github/actions/deps

      # Ruby is needed for exactly one step below: `cargo xtask gem` runs
      # `gem build`, RubyGems' own packager, so the published gem is not
      # built by zeo. The action reads `.ruby-version`.
      - uses: ruby/setup-ruby@v1

      # Builds the tree and stages the payload, then proves the staged binary
      # works: it resolves its payload relative to bin/, links against the
      # staged libzeo.a, and compiles and runs a program.
      - run: cargo xtask dist --target ${{ matrix.target }}

      # The same staging, rearranged into RubyGems' shape. One payload, two
      # artifacts: the tarball above and this gem carry the same bytes.
      - run: cargo xtask gem

      - uses: actions/upload-artifact@v4
        with:
          name: zeo-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
            target/gem/*/*.gem
          if-no-files-found: error

  release:
    name: publish release
    needs: dist
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    # The one job that writes: it creates the Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One SHA256SUMS over every tarball, so a user verifies the whole set
      # with a single `sha256sum -c`. The per-file .sha256 that dist writes
      # stays alongside for anyone checking one download.
      - name: collect checksums
        run: |
          cd artifacts
          ls -la
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The tag must match the version the crates actually carry. A mismatch
      # here means the tag, the crates.io release and the gem would disagree.
      - name: tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag != workspace version $ver"; exit 1; }

      # Notes come from this version's own CHANGELOG section, not from the
      # first section in the file -- that one is `## [Unreleased]`, and taking
      # it would ship an empty release body.
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$ver" \
            '$0 ~ "^## \\[" v "\\]" {n=1; next} n && /^## \[/ {exit} n' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for [$ver]"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            artifacts/*.tar.gz artifacts/*.sha256 artifacts/SHA256SUMS \
            artifacts/*.gem

      # Nothing here pushes to rubygems.org or crates.io. The gems are
      # attached to the GitHub Release so they can be inspected and installed
      # from a file; `gem push` is a deliberate, separate act.
