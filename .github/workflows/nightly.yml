name: Nightly

# What the push tier does not cover: macOS, and the release payload.
#
# A full macOS run is about 40 minutes on a runner that is scarcer and
# slower to schedule than Linux, so macOS runs weekly, and anything more is a
# `workflow_dispatch` by choice.
#
# `moved` skips the heavy jobs when main has not changed since the last green
# nightly, so an idle week costs a few seconds a day.

on:
  schedule:
    # The payload check, daily at 02:00 Pacific.
    - cron: "0 9 * * *"
    # macOS, Sundays.
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      os:
        description: runner
        type: choice
        options: [macos-15, ubuntu-24.04]
        default: macos-15

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

# `moved` reads this workflow's own run history; nothing here writes.
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  moved:
    name: main moved since the last green nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "last green nightly: ${last:-none}; this run: ${{ github.sha }}"
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "nothing new on main; skipping the heavy jobs"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  # The one platform the dev machines already are, so the least CI adds per
  # minute -- and the most expensive minute. The whole profile, weekly. The
  # anchor-workspace claim only macOS can answer rides in it.
  # Each cron excludes the OTHER cron's slot, so a scheduled run gets exactly
  # one job. `workflow_dispatch` sets no schedule, so both guards pass and a
  # manual run does everything -- which is what "run the nightly now" means.
  # The `os` input steers this job only.
  macos:
    name: macOS (weekly)
    needs: moved
    if: needs.moved.outputs.run == 'true' && github.event.schedule != '0 9 * * *'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.os || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: ./.github/actions/deps
      - run: cargo build --workspace
      - run: cargo nextest run -P full --no-fail-fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-macos
          path: target/nextest/full/junit.xml
          if-no-files-found: ignore

  # What ships. The payload is assembled from the resolved store, so every
  # library's path is `<name>-<version>` read out of Gemfile.lock and a stale
  # or partial install is a MISSING directory that `payload::library_dirs`
  # refuses, naming each one: reproducibility by construction.
  payload:
    name: release payload
    needs: moved
    if: needs.moved.outputs.run == 'true' && github.event.schedule != '0 10 * * 0'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/deps

      # The published `zeo` crate carries pregenerated artifacts that its build
      # script would otherwise derive from sibling crates absent from the
      # .crate file. This fails if they drift from their sources.
      - run: cargo xtask stage-crate --check

      # Stage the payload without building it: proves the tree lays out and
      # the docs and gems copy. The archive and the compile-and-run smoke test
      # need a dist-profile build, which the release workflow does.
      - run: cargo xtask dist --stage-only

      # `cargo package --list`, NOT `cargo package`. Both `cargo package` and
      # `cargo publish --dry-run` resolve each dependency's version requirement
      # against the real crates.io index, even with --no-verify. The internal
      # deps are pinned `=0.1.0` and are not published, so those commands fail
      # with "no matching package named zeo-abi" for every crate above the
      # leaves. `--list` reads the manifest and walks the file set without
      # touching the index, which is what this gate is for: proving the
      # manifest parses and the right files ship.
      - name: packages list cleanly and carry their pregen artifacts
        run: |
          cargo xtask stage-crate
          for c in zeo-abi zeo-dsl zeo-gem zeo-macros zeo-rt zeo-capi zeo; do
            n=$(cargo package -p "$c" --list --allow-dirty | wc -l)
            echo "$c: $n files"
          done
          for f in gems.pregen.tar.gz src/class_surface.pregen.rs; do
            cargo package -p zeo --list --allow-dirty | grep -qx "$f" \
              || { echo "::error::zeo package is missing $f"; exit 1; }
          done
          echo "zeo carries both pregen artifacts"
