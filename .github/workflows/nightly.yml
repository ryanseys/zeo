name: Nightly

# The legs the push tier (ci.yml) does not pay for, on a schedule or by hand.
#
# The minutes arithmetic, so nobody moves these back onto every push: a
# private repo has 2,000-3,000 minutes a month; Linux bills at 1x and macOS at
# 10x. The full Linux gate is ~60 minutes. A full-leg macOS run is ~40 minutes
# = 400 billed, so a NIGHTLY macOS would be ~12,000 a month and even the slim
# tier (`make test-jit`, ~17 minutes) ~5,000. macOS therefore runs the slim
# tier once a week, and anything more is a `workflow_dispatch` by choice. A
# self-hosted runner on a developer's Mac is the only free way to more.
#
# `moved` skips the heavy jobs when main has not changed since the last green
# nightly, so an idle week costs a few seconds a day.

on:
  schedule:
    # The Linux gate, daily at 02:00 Pacific.
    - cron: "0 9 * * *"
    # macOS, slim tier, Sundays.
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      os:
        description: runner
        type: choice
        options: [ubuntu-24.04, macos-15]
        default: ubuntu-24.04
      tier:
        description: "make target (test-jit ≈ dev loop, gate = the phase boundary, test-all = everything)"
        type: choice
        options: [test-jit, check-batch, gate, test-all]
        default: gate

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  moved:
    name: main moved since the last green nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "last green nightly: ${last:-none}; this run: ${{ github.sha }}"
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "nothing new on main; skipping the heavy jobs"
            echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

  # The phase boundary (`make gate`: every leg plus the full-spinel AOT and the
  # whole-gem compile), the packaged-codegen differential and the binary-size
  # floor. By hand, any tier on either runner.
  gate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'gate' }} (${{ github.event_name == 'workflow_dispatch' && inputs.os || 'ubuntu-24.04' }})
    needs: moved
    if: needs.moved.outputs.run == 'true' && github.event.schedule != '0 10 * * 0'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.os || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: ./.github/actions/ruby-bundle
      - run: make
      - run: make ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'gate test-packaged test-size build-pure' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ github.job }}-${{ runner.os }}
          path: |
            target/nextest/default/junit.xml
            target/nextest/full/junit.xml
          if-no-files-found: ignore

  # What ships. The payload is assembled from `vendor/bundle`, so every
  # library's path is `<name>-<version>` read out of Gemfile.lock and a stale
  # or partial install is a MISSING directory that `payload::library_dirs`
  # refuses, naming each one: reproducibility by construction.
  payload:
    name: release payload
    needs: moved
    if: needs.moved.outputs.run == 'true' && github.event.schedule != '0 10 * * 0' && (github.event_name != 'workflow_dispatch' || inputs.os == 'ubuntu-24.04')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: ./.github/actions/ruby-bundle
      - run: make deps

      # The published `zeo` crate carries pregenerated artifacts that its build
      # script would otherwise derive from sibling crates absent from the
      # .crate file. This fails if they drift from their sources.
      - run: cargo xtask stage-publish --check

      # Stage the payload without building it: proves the tree lays out and
      # the docs and gems copy. The archive and the compile-and-run smoke test
      # need a dist-profile build, which the release workflow does.
      - run: cargo xtask dist --stage-only

      # `cargo package --list`, NOT `cargo package`. Both `cargo package` and
      # `cargo publish --dry-run` resolve each dependency's version requirement
      # against the real crates.io index, even with --no-verify. The internal
      # deps are pinned `=0.1.0` and are not published, so those commands fail
      # with "no matching package named zeo-abi" for every crate above the
      # leaves. `--list` reads the manifest and walks the file set without
      # touching the index, which is what this gate is for: proving the
      # manifest parses and the right files ship.
      #
      # `zeo` is the one that matters. Its build script needs the two
      # pregenerated artifacts, because the sibling crates it would otherwise
      # read are absent from the .crate file.
      - name: packages list cleanly and carry their pregen artifacts
        run: |
          cargo xtask stage-publish
          for c in zeo-abi zeo-dsl zeo-macros zeo-rt zeo-capi zeo; do
            n=$(cargo package -p "$c" --list --allow-dirty | wc -l)
            echo "$c: $n files"
          done
          for f in gems.pregen.tar.gz src/class_surface.pregen.rs; do
            cargo package -p zeo --list --allow-dirty | grep -qx "$f" \
              || { echo "::error::zeo package is missing $f"; exit 1; }
          done
          echo "zeo carries both pregen artifacts"

  # The one platform the dev machines already are, so the least that CI adds
  # per minute -- and the most expensive minute. The slim tier, weekly, plus
  # the anchor-workspace claim only macOS can answer (`make test-platform`).
  macos:
    name: macOS (weekly, slim)
    needs: moved
    if: needs.moved.outputs.run == 'true' && github.event.schedule == '0 10 * * 0'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: ./.github/actions/ruby-bundle
      - run: make
      - run: make test-jit test-platform test-capi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-macos
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
