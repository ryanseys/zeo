name: ruby-bundle
description: >
  mise.toml's ruby on PATH, the libraries its native gems build against, and
  a cache for vendor/bundle. `make` (via `deps`) does the install itself, so
  the Makefile stays the one entry point and the committed .bundle/config is
  the only bundler configuration in play.

runs:
  using: composite
  steps:
    # What `bundle install` builds extensions against: psych wants libyaml,
    # openssl wants its headers, ffi and fiddle want libffi. macOS has all of
    # these from the SDK and Homebrew already.
    - if: runner.os == 'Linux'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libyaml-dev libssl-dev libffi-dev
      shell: bash

    # No `ruby-version`: the action reads mise.toml, so the runner gets the
    # SAME ruby this machine's `mise which ruby` answers -- the one the lock
    # was resolved with and the one the goldens were blessed against. The
    # harness resolves `mise` first and PATH second, and CI has no mise, so
    # PATH is what decides here. Not `bundler-cache: true`: that rewrites the
    # committed .bundle/config and installs outside `make`.
    - uses: ruby/setup-ruby@v1

    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: bundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'Gemfile.lock') }}
