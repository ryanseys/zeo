name: deps
description: >
  The libraries `Gemfile.lock` names, fetched into vendor/ by
  `cargo xtask deps`, plus a cache for them. No ruby: the corpus compares
  against recorded trailers, and the fetch needs only curl and git.

runs:
  using: composite
  steps:
    # Keyed on the two files that decide what `deps` writes. A hit restores
    # the whole of vendor/ and the fetch then does nothing.
    - uses: actions/cache@v4
      with:
        path: |
          vendor/cache
          vendor/gems
          vendor/ruby
        key: deps-${{ hashFiles('Gemfile.lock', 'crates/xtask/rubygems.lock') }}

    - run: cargo xtask deps
      shell: bash
